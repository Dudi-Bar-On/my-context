name: Release

# A tag is the release. `VERSIONING.md` says so in those words — nothing is
# published to a registry — so the tag arriving is the event that should
# produce a release page, and nothing else should.
#
# This workflow OWNS the tag path. `ci.yml` deliberately does not fire on
# tags, so a tagged commit gets exactly one run rather than two identical
# ones. That is the same reasoning `ci.yml` applies to push-vs-pull_request,
# applied one ref further.
on:
  push:
    tags: ['v*']

# The default token is read-only on a public repository. Creating a release is
# a write, and it is the ONLY write this needs: no packages, no pages, no
# id-token. Narrower than the default, not wider.
permissions:
  contents: write

jobs:
  # The tagged commit is normally already on master and already tested by the
  # master push. This runs anyway, because "normally" is not "always": a tag
  # can be placed on any commit, and the one thing that must never happen is a
  # release page pointing at a tree nobody verified.
  verify:
    name: verify (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runs-on: windows-latest
          - name: ubuntu
            runs-on: ubuntu-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      # `check:board`'s drift tier reads commit history, and a shallow clone shows it none.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm ci
      # See RULE-quote-the-test-glob. Before the suite, for the same reason.
      - run: npm run check:test-glob
      # A test that does not say what it rests on cannot be found when the ruling
      # it rests on is reversed. Measured in cdc9fd8: one reversal reddened 26
      # fixtures across ten files, not one of them a logic failure, and ZERO named
      # the rule they encoded. This GATES -- a missing, malformed or dangling
      # declaration fails the build -- so it belongs here rather than riding
      # `npm test`, which is the tree's line between a gate and a reporter. It is
      # beside `check:test-glob` because the two ask the same question from
      # opposite ends: that the suite reaches every file, and that every file it
      # reaches says what it assumes. `test/scripts/basis-gate.test.ts` proves the
      # checker itself, the way every other checker here is proved.
      - run: npm run check:basis
      # A correction recorded in a plan's section 0 must also be applied in its
      # body. That gap is invisible by construction -- a correct section 0 tells
      # you nothing about whether the tasks agree with it.
      - run: npm run check:retired
      - run: npm run check:text-files
      # ── This list must be a SUPERSET of `ci.yml`'s, and on 2026-09-13 it was
      # not. ────────────────────────────────────────────────────────────────
      #
      # The job above says why this workflow re-verifies at all: "a tag can be
      # placed on any commit, and the one thing that must never happen is a
      # release page pointing at a tree nobody verified." A gate that master
      # runs and a tag does not turns that sentence into its opposite — the
      # release is verified LESS than the commits it is cut from.
      #
      # `check:vendor` was exactly that hole, found by report 6: it was in
      # `ci.yml` and not here, so a tagged build could publish a patched
      # vendored asset that master would have rejected. The four beside it were
      # in neither workflow. `check:cited-items` is in neither, deliberately —
      # it can never exit non-zero on a finding; see the paragraph in `ci.yml`.
      # `test/scripts/workflow-gates.test.ts` pins the superset relation so this
      # cannot drift apart again in silence.
      - run: npm run check:vendor
      - run: npm run check:dependencies
      - run: npm run check:needs-cycles
      - run: npm run check:handover
      # Here for the superset reason the paragraph above gives: a tag must
      # verify at least what the commit it is cut from verified. Its map tier
      # genuinely gates, so this is not the never-red step that keeps
      # `check:cited-items` out of both workflows.
      - run: npm run check:board
      - run: npm run typecheck
      - run: npm test
      # Moved back BELOW `npm test`, matching `ci.yml`'s reordering and its
      # reason: for 27 days (2026-08-21 to 2026-09-17) the unit suite never
      # ran on master because this documentation-tier gate was red in front of
      # it and nobody was looking. The cheap `check:*` gates above still run
      # first — that argument is unchanged — this one just no longer sits
      # ahead of the suite it must not hide, on a tag cut any more than on a
      # push.
      - run: npm run verify:citations
      - run: npm run test:perf

      # ── The one gate here that needs a browser, and the reason it is worth
      # a download on a tag cut. ───────────────────────────────────────────
      #
      # `check:diagrams` parses every mermaid fence in the documents and draws
      # nothing (owner ruling 2026-09-17, "the parse-only gate"). A fence that
      # does not parse renders as an error box, and A TAG IS WHEN THE DOCUMENTS
      # SHIP — so of all the gates, this is the one whose subject is exactly
      # what a release page points at. The superset rule above applies to it
      # like the rest: `ci.yml` runs it, so this runs it.
      #
      # `test:e2e` is the admitted exception to that rule and this is NOT a
      # second one: the browser suite is twelve minutes and Chromium is
      # Chromium, while this is about two seconds on a definition set that a
      # tag can change. The cache is keyed and the shell is the 275 MB
      # `--only-shell` download, exactly as in `ci.yml`; ubuntu-only for the
      # same reason.
      - name: cache the playwright browser
        if: matrix.name == 'ubuntu'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: install the headless shell
        if: matrix.name == 'ubuntu'
        run: npx playwright install --only-shell --with-deps chromium
      - name: every mermaid fence in the documents parses
        if: matrix.name == 'ubuntu'
        run: npm run check:diagrams

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }

      # `VERSIONING.md` lists five steps and warns what fails loudly when one
      # is skipped. Skipping step 2 — `set-version` — is the one that fails
      # QUIETLY: the tag says 1.0.3 and every manifest still says 1.0.2, so
      # `mycontext status` reports a version that was never released. Caught
      # here rather than discovered by a user.
      - name: the tag and the manifests must agree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG but package.json says $PKG."
            echo "::error::Step 2 of 'Cutting a release' in VERSIONING.md is 'node scripts/set-version.ts X.Y.Z'."
            exit 1
          fi
          echo "tag v$TAG matches package.json $PKG"

      # The changelog is the release notes. Not a paraphrase of them — the
      # same words, so the two cannot drift. This exits non-zero when the
      # section is missing, which is the correct outcome: a release nobody
      # wrote notes for should not be published silently.
      - name: take the release notes from CHANGELOG.md
        run: node scripts/changelog-section.ts "$GITHUB_REF_NAME" > RELEASE_NOTES.md

      - name: create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
