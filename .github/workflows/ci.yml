name: CI

# Two triggers, scoped so a commit is never tested twice.
#
# `on: [push, pull_request]` fires BOTH on any push to a branch with an open
# PR, so every commit under review ran twice. Measured on this repository
# 2026-08-18: commit 20c0bb9 produced two runs 27 seconds apart, ids
# 32130650921 and 32130689527, identical in every respect. Restricting `push`
# to master — the one ref that never carries a PR — leaves exactly one run per
# commit.
#
# Tags are deliberately absent: `release.yml` owns that ref, and it verifies
# before it publishes. Listing tags here too would give a tagged commit two
# identical runs, which is the defect this trigger exists to remove.
on:
  push:
    branches: [master]
  pull_request:

# A newer commit on a PR cancels the run still in flight for the older one, so
# a force-pushed review fix does not pay for a run testing a commit nobody will
# merge.
#
# Scoped to pull_request deliberately. Cancelling a master or tag run would
# discard the record of whether a released commit passed, and that is the one
# run which cannot be reconstructed afterwards.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        # Both jobs run on GitHub's hosted runners, and on a PUBLIC repository
        # standard hosted minutes are not metered — so the cost argument that
        # shaped this block no longer applies. It is kept as a record rather
        # than deleted, because the reasoning becomes live again the moment the
        # repository goes private.
        #
        # WHEN PRIVATE: Windows minutes bill at 2x and Linux at 1x, so a ~12
        # minute run costs 12 ubuntu + 24 billed windows — Windows is two
        # thirds of it. To move Windows onto your own machine, register a
        # self-hosted runner (Settings > Actions > Runners > New self-hosted
        # runner, Windows) and swap the two `runs-on` lines marked below;
        # self-hosted minutes are never billed.
        #
        # Do NOT enable that swap before the runner is registered and online: a
        # job requesting a label no runner offers queues indefinitely rather
        # than failing, so CI would appear to hang rather than to break.
        include:
          - name: windows
            runs-on: windows-latest
            # runs-on: [self-hosted, Windows, X64]   # <- swap to this
          - name: ubuntu
            runs-on: ubuntu-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      # `check:board`'s drift tier reads commit history, and a shallow clone shows it none.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm ci
      # Before `npm test`, not after: a check that runs afterwards tells you
      # the suite you already trusted was wrong. See RULE-quote-the-test-glob —
      # an unquoted glob ran 2 of 4 files and exited 0.
      - run: npm run check:test-glob
      # A test that does not say what it rests on cannot be found when the ruling
      # it rests on is reversed. Measured in cdc9fd8: one reversal reddened 26
      # fixtures across ten files, not one of them a logic failure, and ZERO named
      # the rule they encoded. This GATES -- a missing, malformed or dangling
      # declaration fails the build -- so it belongs here rather than riding
      # `npm test`, which is the tree's line between a gate and a reporter. It is
      # beside `check:test-glob` because the two ask the same question from
      # opposite ends: that the suite reaches every file, and that every file it
      # reaches says what it assumes. `test/scripts/basis-gate.test.ts` proves the
      # checker itself, the way every other checker here is proved.
      - run: npm run check:basis
      # A correction recorded in a plan's section 0 must also be applied in its
      # body. That gap is invisible by construction -- a correct section 0 tells
      # you nothing about whether the tasks agree with it.
      - run: npm run check:retired
      - run: npm run check:text-files
      # A vendored file is committed third-party code, and the one thing it may
      # never be is edited in place. This recomputes every digest in
      # src/ui/public/lib/vendor/VENDOR.md and re-scans for fetch/eval, so a
      # patched or silently upgraded asset is red here rather than a surprise.
      - run: npm run check:vendor
      # ── The four below were written as gates and run by nothing. ──────────
      #
      # Measured 2026-09-13 (report 6, G1): `check:needs-cycles`,
      # `check:handover`, `check:dependencies` and `check:cited-items` appeared
      # in NEITHER workflow, and `verify:citations` only in `release.yml` — so
      # the one gate that was red was the one gate only a tag cut ran. Four of
      # that day's twelve blockers would have been caught by gates that already
      # existed. Each runs in well under two seconds; the reason they are here
      # rather than in a hook is that a hook running five checks on every commit
      # gets disabled by the first person it annoys.
      #
      # `check:cited-items` is DELIBERATELY NOT IN THIS LIST, and that is a
      # ruling rather than an omission — 7d10c14d, in its own words: "a
      # never-gating check there prints 224 lines into a green log and
      # manufactures the appearance of coverage". Its only three non-zero exits
      # are anti-vacuity guards; no finding it reports can ever fail a run. A
      # step that cannot go red is the vacuous gate this repository keeps
      # catching, so it stays a thing a person runs and reads.
      # `test/scripts/workflow-gates.test.ts` pins that absence with its reason,
      # so removing this paragraph alone does not quietly reverse it.

      # `CONST-zero-runtime-dependencies` is the promise a user installs on, and
      # until now nothing in either workflow read `package.json` against it.
      # `npm test` does carry the condition — `dependency-budget.test.ts` audits
      # the real manifest against the real constraint — but a test failure says
      # "expected [] to deepEqual [...]" where this names the offending field and
      # the constraint sentence it breaks. This is also the one gate the
      # pre-commit hook runs (`.githooks/pre-commit`), because `npm i --save` is
      # a working-tree act and the commit is where it can still be cheaply undone.
      - run: npm run check:dependencies
      # A cycle in `needs:` is invisible to every other check: both ends are
      # well-shaped, both resolve, neither is done, so both rows sit in `ready`'s
      # held list saying "a blocker has not landed" — true, ordinary-looking, and
      # permanent. THIS IS THE ONLY ONE OF THE FIVE WITH NO TEST FILE, so before
      # this line it was gated by nothing anywhere: 3dba1964 wired the npm script
      # and said in as many words that it stayed local "until two lines are added
      # to ci.yml and release.yml". These are those lines.
      - run: npm run check:needs-cycles
      # A handover pointer that names nothing sends the next lane to a lane or an
      # item that does not exist. Only the DANGLING tier gates; RETIRED and
      # CARRIED are reported and never gate, argued at length in eded62f1 — a
      # handover is a historical document and a block written before a retirement
      # was true when it was written.
      - run: npm run check:handover
      # The D map GATES and the drift tier REPORTS, in one step on purpose. The
      # map half fails the run when a row does not parse, when a D number
      # repeats, when a member names work this corpus does not hold, or when one
      # item falls under two subjects — a silently unparsed row is how a subject
      # leaves the board, which is the failure this replaces. The drift half —
      # a commit named an item and the item is still open — can never fail a
      # run, because a filing commit names its own item and a partial landing is
      # legitimate. It is in this step rather than a step of its own precisely
      # because of the ruling above `check:cited-items`: a never-gating check on
      # its own line prints into a green log and manufactures the appearance of
      # coverage. Here it prints inside a run whose greenness means something.
      - run: npm run check:board
      # A failure this codebase catches and then says NOTHING about, and a write
      # result a producer returns and the call site drops. Report 3 proposed
      # this gate twice — once for its pattern P1 and once for P2 — the
      # consolidation carried every INSTANCE forward and the gate nowhere, and
      # both proposals came back a month later as
      # `TASK-the-gate-for-the-swallow-class-was-proposed-twice-and-built` and
      # `TASK-d70-closed-all-five-instances-and-never-built-the-gate-the`. Their
      # shared argument is why this is a CI step and not a review: when the last
      # instance closes the subject READS FINISHED, and the whole-codebase review
      # that made the class findable will not run again.
      #
      # It gates what this package SHIPS, read at run time from
      # `package.json:files`, and it detects SILENCE rather than `catch` — 195
      # catch blocks in this tree carry a written argument and not one of them
      # trips it. `test/scripts/swallow-gate.test.ts` plants every class it
      # claims to detect and asserts the exit code and the printed line, the way
      # every other checker here is proved.
      #
      # Beside `check:board` rather than after `npm test`: it is a two-second
      # scan, and the cheap-fails-first trade every ordering in this file argues
      # for applies to it unchanged.
      - run: npm run check:swallows
      - run: npm run typecheck
      - run: npm test
      # AFTER `npm test`, not before. The reasoning that put the cheap
      # `check:*` gates ahead of the suite still stands — each is a two-second
      # check that fails long before a twelve-minute run would tell you the
      # same thing. This gate is not one of them: it exits on the
      # DOCUMENTATION tier only, and for 27 days (2026-08-21 to 2026-09-17) the
      # unit suite never ran on master because this gate was red in front of
      # it and nobody was looking. A documentation-tier gate must never be the
      # thing standing between a push and the suite that actually proves the
      # code, so it now runs after that suite rather than in front of it.
      - run: npm run verify:citations
      - run: npm run test:perf

      # ── The browser suite. UBUNTU ONLY, and deliberately so. ──────────────
      #
      # Every other step runs on both runners because the CLI's path handling
      # and terminal rendering are genuinely OS-dependent — `pin-rendering.ts`
      # exists for exactly that. None of it is in play here: this suite
      # drives the REAL server — `e2e/global-setup.ts` boots it against a
      # sandboxed temp workspace and every spec talks to it over `http`, not
      # `file://`. (It used to load one self-contained HTML mockup instead;
      # `screen-parity.spec.ts`, `pixel-parity.spec.ts` and `tree-parity.spec.ts`
      # were the specs that compared the real screens against that mockup, and
      # ruling B, 2026-09-21 (`DEC-the-mockup-is-a-reference-to-initial-thoughts-and-only-a`)
      # retired the mockup as a source of truth, so those three specs are gone —
      # this comment used to describe them and no longer does.) Chromium is
      # Chromium. Running it twice doubles a 275 MB download for no additional
      # signal, and if this repository ever goes private, Windows minutes bill
      # at 2x (see the note on the matrix above).
      #
      # AFTER the cheap checks, never before. The static checkers catch what a
      # browser cannot — EN/HE key parity in both directions, dead translation
      # keys, physical CSS, a truncated script element — and they finish in
      # seconds. The browser catches what they cannot: a page whose JavaScript
      # never ran at all, which is a defect this project has actually shipped.
      # Neither substitutes for the other; the cheap one fails first.
      #
      # `--only-shell`: the headless shell is 275 MB against 703 MB for the
      # full Chrome-for-Testing download, and the suite was verified to pass
      # 21/21 on the shell alone. `--with-deps` installs the system libraries
      # the shell needs and is available on hosted ubuntu; Windows would need
      # no deps step at all, which is one more reason this is ubuntu-only.
      #
      # The cache is keyed on the lock file rather than on the resolved
      # Playwright version: it over-invalidates when any dependency moves, and
      # that is the safe direction. A stale browser against a newer Playwright
      # fails in ways that look like the page's fault.
      - name: cache the playwright browser
        if: matrix.name == 'ubuntu'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: install the headless shell
        if: matrix.name == 'ubuntu'
        run: npx playwright install --only-shell --with-deps chromium
      # A mermaid fence that does not PARSE ships to readers as an error box,
      # and until this line nothing looked: `gen-diagrams.ts`'s
      # `DIAGRAM_SOURCES` lists the two READMEs, so no fence under `docs/` was
      # generated, committed or gated. `docs/capabilities/07-restore-and-handover.md:78`
      # carried `&lt;key&gt;` — whose `&` ends mermaid's lexer — for as long as
      # it existed, and its author reported "every fence parses" having checked
      # BRACKET BALANCE. Balance is not parsing.
      #
      # It DRAWS NOTHING: owner ruling 2026-09-17, "the parse-only gate",
      # against widening `DIAGRAM_SOURCES` — drawing the undrawn fences was
      # measured at ~1.5-1.8 MiB and is past a size budget already rejected.
      #
      # It is HERE, in the browser block, for one reason: mermaid is a browser
      # library, so this needs the Chromium the step above installs. That is
      # also why it is ubuntu-only. It costs ~2 seconds against that suite's
      # twelve minutes, so it runs FIRST within the block — the same cheap-fails-
      # first trade every ordering in this file argues for.
      - name: every mermaid fence in the documents parses
        if: matrix.name == 'ubuntu'
        run: npm run check:diagrams
      - name: browser suite
        if: matrix.name == 'ubuntu'
        run: npm run test:e2e

      # A hosted runner is destroyed after every job, so nothing it leaves
      # behind matters. A self-hosted runner is a real machine that keeps
      # running, and this suite creates temp workspaces heavily — every one of
      # them under the OS temp directory with a `myctx-` prefix. The helpers
      # remove their own, but a killed or crashed run leaves them, and on a
      # persistent runner they accumulate until the disk notices.
      #
      # Two deliberate limits:
      #
      # - Only `myctx-*` is touched. This runs on the owner's own workstation,
      #   where clearing the whole temp directory would delete other programs'
      #   working files.
      # - Only directories older than 30 minutes. A run takes about 12, so
      #   anything past 30 belongs to a job that has finished. Without that
      #   guard this step would delete the workspaces of a suite the owner is
      #   running by hand at the same moment, and those failures would be
      #   baffling. Leaks are therefore collected by the NEXT run, not this one,
      #   which is the correct trade.
      - name: remove leaked test workspaces
        if: ${{ always() && contains(matrix.runs-on, 'self-hosted') }}
        # `powershell` (5.1) rather than `pwsh` (7): 5.1 ships with every
        # Windows install, 7 does not, and a self-hosted runner is whatever
        # machine you registered. The script below is valid in both.
        shell: powershell
        run: |
          $cutoff = (Get-Date).AddMinutes(-30)
          Get-ChildItem -Path $env:TEMP -Directory -Filter 'myctx-*' -ErrorAction SilentlyContinue |
            Where-Object { $_.LastWriteTime -lt $cutoff } |
            ForEach-Object {
              Write-Host "removing $($_.FullName)"
              Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
            }
