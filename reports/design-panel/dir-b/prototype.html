tepick":"Item","preview.whyn":"The gates in {m:select()}'s own order — eligible, tier, focus, scope, seen, budget — because the order is the explanation: a list of six reasons is noise, and the one that binds is only meaningful in the position it holds. Rungs above it passed, the rung itself carries the diagnosis, and everything below is not reached rather than passed. Composing the fix needs a stable code on {m:injection()}; today the five causes differ only in English prose.","preview.ribbon":"Budget ribbon — four tiers, and what fell out of each","preview.ribbonn":"One segment per admitted item, sized by its real {m:itemCost}. Beneath each track is the ghost lane: every spilled item at the width it would have taken, in the position the selector considered it. A wide ghost followed by a narrow fill is first-fit being honest — drawing spills as a tail would misrepresent the algorithm. A tier this event never reaches is drawn as absent, hatched and named; an empty track would claim it ran and delivered nothing, which is a different fact. Follows the event selector above rather than adding a second one.","btn.copy":"Copy","th.when":"When","ribbon.notThisEvent":"does not run on this event","ribbon.absent":"Absent, not empty — this event never reaches the tier at all.","ribbon.in":"in","ribbon.out":"out","ribbon.allFit":"Everything selected fit. Headroom {headroom} tokens.","ribbon.someSpilled":"Headroom {headroom}. The smallest thing that did not fit costs {smallest} — so the headroom is not usable by anything currently selected.","watch.h":"Audit stream","watch.v":"the only record of what spilled","watch.sub":"Six record kinds — mutations, injections, hook actions, focus changes, access refusals and progress steps. A focus change is a regime change, drawn as a rule across the feed rather than as one row.","watch.pulsen":"Activity pulse — one column per ten seconds, newest at the reading-end edge. Height is records in that column, colour is the record kind. It is the
