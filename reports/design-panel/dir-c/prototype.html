  DIRECTION C — "INK ORDER"
  Visual direction panel · mycontext web UI v2 · reports/design-panel/dir-c/

  THE IDEA, IN ONE SENTENCE
  Every answer in this product is INKED IN THE ORDER THE MACHINE COMPUTED IT
  and stops where the machine stopped — so what was never reached stays
  visibly un-inked, and colour is spent only on quantities that were measured,
  never on decoration and never on "you may click this".

  It is not an aesthetic of instruments. It is one rule about WHEN a mark is
  allowed to appear: a thing may be drawn only once the machine has actually
  computed it, in the position the machine computed it in. Everything else in
  the direction — the hatch, the pen set, the three voices, the sigil — falls
  out of that rule.

  WHAT IS FABRICATED
  All data is the mockup's own fixture data, copied verbatim from
  docs/design/web-ui-mockup.html — GATES, WHYNOT, CANDIDATES, TIER_BUDGET,
  REC, AUDIT_KINDS. The single real number is the 0.55 ms audit-append p95.
  The Hebrew is the product's own Hebrew, lifted key-for-key from the HE table
  in the mockup; nothing here is machine-translated.

/* ══════════════════════════════════════════════════════════════════════════
   1 · TOKENS
   The ground is not paper and not "dark mode". It is the bed a recording
   instrument draws on: a cool oat-grey desk, with the record itself sitting
   ON it as a lighter strip. Dark theme is the same instrument at night —
   never pure black, because ink on true black is a thing that does not exist.
   Deliberately NOT the AI-default warm cream #F4F1EA.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  color-scheme:light dark;

  /* ── ground ── */
  --bed:      light-dark(#D9DBD2,#08090B);   /* the desk */
  --record:   light-dark(#F8F8F4,#131518);   /* the paper strip */
  --record-2: light-dark(#F1F1EA,#171A1E);   /* banded / recessed */
  --band:     light-dark(#E3E5DB,#0E1013);   /* the ruled margin */
  --well:     light-dark(#EDEEE6,#0D0F12);   /* corpus well */

  /* ── ink ── */
  --ink:    light-dark(#14171A,#E9EAE5);
  --ink-2:  light-dark(#474C4A,#A7ACA6);
  --ink-3:  light-dark(#5D625E,#8C918A);     /* ≥4.5:1 on --band, measured */
  --rule:   light-dark(#DBDDD3,#232629);     /* decorative hairline */
  --rule-2: light-dark(#A5A99D,#3C4148);     /* decorative: bounds a RULE */
  /* --rule-2 bounds rules, which owe nothing. --ctrl bounds CONTROLS, which
     owe 3:1 under WCAG 1.4.11 and measured 2.2:1 as --rule-2. Two tokens for
     the same job is not duplication: one of them carries an obligation. */
  --ctrl:   light-dark(#7C7F73,#666D79);

  /* ── THE PEN SET ────────────────────────────────────────────────────────
     Five pens. A pen is a colour that MEANS ONE MEASURED QUANTITY. There is
     no sixth colour, because there is no sixth quantity. Interaction is NOT
     a pen — nothing in this interface is coloured to say "clickable".
     ── */
  --gov: light-dark(#87680E,#E2BA51);  /* governs — has authority here      */
  --del: light-dark(#1A6053,#5CBCA6);  /* delivered · measured · in sync    */
  --def: light-dark(#9C4E10,#E2A05C);  /* deficient — gap, drift, attention */
  --ref: light-dark(#8F2F2E,#E28379);  /* refused · withheld by rule · fail */
  --car: light-dark(#3C4C8A,#98AAE9);  /* carried in from somewhere else    */

  --gov-w: color-mix(in oklch,var(--gov) 13%,var(--record));
  --del-w: color-mix(in oklch,var(--del) 13%,var(--record));
  --def-w: color-mix(in oklch,var(--def) 13%,var(--record));
  --ref-w: color-mix(in oklch,var(--ref) 13%,var(--record));
  --car-w: color-mix(in oklch,var(--car) 13%,var(--record));

  /* ── ABSENCE ────────────────────────────────────────────────────────────
     ONE treatment carries every kind of absence in this product: spilled,
     not reached, not examined, not recorded, absent tier, never injected.
     Learned once, read everywhere. It is never grey-out and never empty.
     ── */
  /* The hatch is not decoration — it is the mark that carries every kind of
     absence in this product, so it is a meaningful graphical object and owes
     3:1 like any other. Measured 2.2 / 2.0 before this correction. */
  --hatch:   light-dark(#83887A,#6A7180);
  --hatch-a: 45deg;

  /* ── the pen's travel direction, mirrored for Hebrew ── */
  --po: left;

  /* ── type ── */
  --sans:"Plex",ui-sans-serif,"Segoe UI",system-ui,Arial,sans-serif;
  --mono:"PlexMono",ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  --book:"Ruhl","Frank Ruehl CLM",Georgia,"Times New Roman",serif;

  --fs-00:9.5px; --fs-0:10.5px; --fs-1:12px; --fs-2:13.5px; --fs-3:15px; --fs-4:24px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
  --gut:28px;

  /* MOTION ─────────────────────────────────────────────────────────────────
     A plotter pen rides a servo: it ramps and settles, so INK eases. Paper on
     a sprocket does not: the feed is a stepper at a constant rate, so FEED is
     linear — the same reason Railway's split-flap board eases nothing.
     Every duration is declared twice, the second time at 1 ms (Stripe's
     reduced-motion pattern): the animation still runs and simply lands, so
     there is no second code path and no !important anywhere.
     */
  --ease-pen:cubic-bezier(.25,.05,.20,1);
  --ease-stamp:cubic-bezier(.30,1.45,.55,1);
  --ease-feed:linear;
  --t-ink:300ms; --t-stamp:190ms; --t-row:360ms; --t-rise:240ms; --t-draw:620ms;
  --t-scale:1;              /* multiplies every stagger delay */
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"] {color-scheme:dark}
:root[dir="rtl"]{--po:right; --hatch-a:-45deg}

*{box-sizing:border-box}
html,body{block-size:100%}
body{
  margin:0;background:var(--bed);color:var(--ink);overflow:hidden;
  font:var(--fs-2)/1.5 var(--sans);
  font-variant-numeric:tabular-nums slashed-zero;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}

/* ── THE THREE VOICES ─────────────────────────────────────────────────────
   The product already rules that "corpus text sits in a well; the product's
   own words never do — that is how you tell them apart." This direction makes
   that rule TYPOGRAPHIC, which is the one place it cannot be missed.

   1 INSTRUMENT  Plex Sans / Plex Sans Hebrew — the product's own voice.
   2 MACHINE     Plex Mono — identifiers, paths, commands, every figure.
                 Always LTR. Plex Mono has no Hebrew and needs none: the
                 product's own rule says these strings never mirror.
   3 CORPUS      Frank Ruhl Libre — text read off disk. The 1908 Hebrew book
                 serif, Latin and Hebrew in one variable family. Set LARGER
                 and looser than the chrome, because the governed words matter
                 more than the tool that shows them.
   ── */
.m,code,kbd,pre{
  font-family:var(--mono);font-size:.88em;font-variant-numeric:tabular-nums slashed-zero;
  direction:ltr;unicode-bidi:isolate;letter-spacing:-.005em;
}
bdi,.v{unicode-bidi:isolate}
/* Hebrew has no italic tradition, and Plex Sans Hebrew is not variable: let the
   browser fake NEITHER. Skewed or smeared Hebrew reads as broken to a Hebrew
   reader in a way skewed Latin does not. */
:root{font-synthesis:none}

.corpus{
  font-family:var(--book);font-size:15.5px;line-height:1.62;font-weight:400;
  letter-spacing:.002em;
}
.corpus:dir(rtl){font-size:16.5px;line-height:1.75}
.corpus b,.corpus strong{font-weight:700}

h2{margin:0;font:600 var(--fs-4)/1.15 var(--sans);letter-spacing:-.022em}
h3{margin:0;font-size:var(--fs-2);font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
table{border-collapse:collapse;inline-size:100%}
:where(button,a,input,select,summary,[tabindex]):focus-visible{
  outline:2px solid var(--ink);outline-offset:2px;border-radius:1px}

/* ── the universal absence mark ── */
.hatched{
  background-image:repeating-linear-gradient(var(--hatch-a),
    var(--hatch) 0 1px, transparent 1px 5px);
}

/* ══════════════════════════════════════════════════════════════════════════
   2 · MOTION — four motions, and no fifth
   ink   a pen travels across a track
   draw  a stroke is laid down (sigils, the pulse's newest column)
   stamp a mark lands on paper
   feed  the record advances by one row
   All one-shot. Nothing loops except the pulse, which is honestly live.
   ══════════════════════════════════════════════════════════════════════════ */
@keyframes ink   {from{transform:scaleX(0)} to{transform:scaleX(1)}}
@keyframes draw  {from{stroke-dashoffset:var(--len,400)} to{stroke-dashoffset:0}}
@keyframes stamp {from{opacity:0;transform:scale(1.22) rotate(-1.6deg)}
                  60%{opacity:1} to{opacity:1;transform:none}}
@keyframes feed  {from{opacity:0;transform:translateY(-7px)} to{opacity:1;transform:none}}
@keyframes rise  {from{transform:scaleY(0)} to{transform:scaleY(1)}}

@media (prefers-reduced-motion:reduce){
  :root{--t-ink:1ms;--t-stamp:1ms;--t-row:1ms;--t-rise:1ms;--t-draw:1ms;--t-scale:0}
}
/* the panel's own switch, so the owner can hold the pen still and compare */
body.still{--t-ink:1ms;--t-stamp:1ms;--t-row:1ms;--t-rise:1ms;--t-draw:1ms;--t-scale:0}

/* ══════════════════════════════════════════════════════════════════════════
   3 · SHELL
   ══════════════════════════════════════════════════════════════════════════ */
.app{
  display:grid;block-size:100vh;
  grid-template-rows:44px 1fr 24px 28px;
  grid-template-columns:206px 1fr;
  grid-template-areas:"top top" "rail rec" "prov prov" "strip strip";
}
.app.pane-open{grid-template-columns:206px 1fr 336px;
  grid-template-areas:"top top top" "rail rec pane" "prov prov prov" "strip strip strip"}

/* ── head ── */
.top{
  grid-area:top;background:var(--band);border-block-end:1px solid var(--rule-2);
  display:flex;align-items:center;gap:var(--sp-3);padding-inline:var(--sp-3);z-index:6;
}
.logo{display:flex;align-items:center;gap:9px;flex:none}
.logo .nm{font-weight:600;font-size:var(--fs-1);letter-spacing:.01em}
.logo .vr{font-family:var(--mono);font-size:var(--fs-00);color:var(--ink-3)}
/* The mark is a pen at rest on a ruled line. */
.pen{inline-size:18px;block-size:18px;flex:none;color:var(--gov)}
.spacer{margin-inline-start:auto}
.icon{
  min-inline-size:26px;block-size:26px;padding-inline:7px;border:1px solid var(--ctrl);
  background:var(--record-2);font-size:var(--fs-1);display:inline-flex;align-items:center;
  justify-content:center;gap:5px;border-radius:2px;
}
.icon:hover{border-color:var(--ink-3)}
.icon[aria-pressed="true"]{background:var(--ink);color:var(--record);border-color:var(--ink)}

/* ── rail ── */
.rail{
  grid-area:rail;background:var(--band);border-inline-end:1px solid var(--rule-2);
  overflow-y:auto;padding-block:var(--sp-3);
}
.grp{margin-block-end:var(--sp-4)}
.grp > p{
  font-size:var(--fs-00);font-weight:600;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink-3);padding-inline:var(--sp-3);margin-block-end:5px;
}
/* Hebrew has no case and letterspacing Hebrew damages it. */
:root[lang="he"] .grp > p,:root[lang="he"] .runhead .lbl,:root[lang="he"] .welllabel{
  text-transform:none;letter-spacing:0}
.nav{
  display:flex;align-items:center;gap:var(--sp-2);inline-size:100%;text-align:start;
  padding:5px var(--sp-3);font-size:var(--fs-1);color:var(--ink-2);position:relative;
}
.nav:hover{color:var(--ink);background:var(--record-2)}
/* Selection is a PEN MARK in the margin, not a colour fill: the rail is the
   record's margin and this is where a reader ticks their place. */
.nav::before{
  content:"";position:absolute;inset-inline-start:0;inset-block:3px;inline-size:3px;
  background:var(--ink);transform:scaleX(0);transform-origin:var(--po) center;
  transition:transform 160ms var(--ease-pen);
}
.nav[aria-current="page"]{color:var(--ink);font-weight:600}
.nav[aria-current="page"]::before{transform:scaleX(1)}
.cnt{
  font-family:var(--mono);font-size:var(--fs-00);margin-inline-start:auto;color:var(--def);
  border-block-end:1.5px solid var(--def);line-height:1.1;
}
.prop{
  font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;color:var(--car);
  border:1px solid var(--car);padding:0 3px;border-radius:1px;margin-inline-start:auto;
}

/* ══════════════════════════════════════════════════════════════════════════
   4 · THE RECORD
   Not cards floating on a page. One continuous strip, ruled into runs, with a
   margin band down the reading-start edge. The band is where a record is
   annotated: it carries each run's pen and each run's tick.
   ══════════════════════════════════════════════════════════════════════════ */
.rec{
  grid-area:rec;background:var(--record);overflow-y:auto;overflow-x:hidden;position:relative;
  /* The two-column run must break on the RECORD's width, not the window's —
     opening the detail pane takes 336px out of the record and leaves the
     window unchanged. */
  container:record / inline-size;
}
.rec::before{ /* the ruled margin, continuous down the whole record */
  content:"";position:absolute;inset-block:0;inset-inline-start:0;inline-size:var(--gut);
  background:var(--band);pointer-events:none;z-index:0;
  border-inline-end:1px solid var(--rule-2);
  box-shadow:inset calc(-3px * var(--sgn,1)) 0 0 -2px var(--rule);
}
:root[dir="rtl"]{--sgn:-1}
.screen{padding-inline:var(--gut) 0;padding-block-end:var(--sp-6)}
.screen[hidden]{display:none}

/* ── the page head ── */
.phd{
  padding:var(--sp-4) var(--sp-5) var(--sp-3);border-block-end:1px solid var(--rule-2);
  display:flex;align-items:baseline;gap:var(--sp-4);flex-wrap:wrap;
}
.psub{
  padding:var(--sp-3) var(--sp-5) 0;color:var(--ink-2);font-size:var(--fs-1);max-inline-size:74ch;
}

/* ── a run: one block of record ─────────────────────────────────────────────
   Its head carries a RUNNING HEAD and, at the reading end, THE SOURCE OF ITS
   NUMBERS. Structure encoding something true: in a provenance tool, the one
   fact every block owes the reader is where its figures came from.
   ── */
.run{margin-block-start:var(--sp-5);position:relative}
.run:first-of-type{margin-block-start:var(--sp-4)}
.runhead{
  display:flex;align-items:center;gap:var(--sp-3);position:relative;
  padding:0 var(--sp-5) 5px;border-block-end:1px solid var(--rule-2);
}
.runhead .lbl{
  font-size:var(--fs-0);font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--ink);
}
.runhead .src{
  margin-inline-start:auto;font-family:var(--mono);font-size:var(--fs-00);color:var(--ink-3);
  white-space:nowrap;
}
/* the run's pen, at the head of its own run */
.run > .tick{display:contents}
.runhead > i,.subhead > i,.run > .tick i{
  display:block;inline-size:3px;block-size:12px;background:var(--pen,var(--ink-3));
  transform:scaleY(1);transform-origin:top;flex:none;align-self:center;
  margin-inline-end:2px;
}
.run > .tick i{position:absolute;inset-block-start:1px;inset-inline-start:calc(-1 * var(--sp-3))}
.run{padding-inline-start:0}
.inking .tick i,.rec.inking .run > .tick i{
  animation:rise var(--t-rise) var(--ease-pen) both;
  animation-delay:calc(var(--d,0ms) * var(--t-scale))}
.runbody{padding:var(--sp-3) var(--sp-5) 0}
/* Delivered and Why-not are one question asked twice, so they sit side by side
   — and it puts the gate ladder above the fold, where the argument is. */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);
  gap:var(--sp-6);align-items:start}
@container record (max-width:1000px){.two{grid-template-columns:minmax(0,1fr)}}
.subhead{
  display:flex;align-items:center;gap:var(--sp-3);padding-block-end:5px;
  border-block-end:1px solid var(--rule-2);margin-block-end:var(--sp-3);
}
.subhead .lbl{font-size:var(--fs-0);font-weight:600;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink)}
:root[lang="he"] .subhead .lbl{text-transform:none;letter-spacing:0}
.subhead .src{margin-inline-start:auto;font-family:var(--mono);font-size:var(--fs-00);
  color:var(--ink-3);white-space:nowrap}
.note{
  color:var(--ink-2);font-size:var(--fs-1);max-inline-size:78ch;margin-block-start:var(--sp-3);
  padding-inline-start:var(--sp-3);border-inline-start:1px solid var(--rule);
}

/* ── the verdict: a stamp, not an emoji ── */
.verdict{
  display:inline-flex;align-items:center;gap:7px;font-size:var(--fs-1);color:var(--del);
  font-weight:600;
}
.inking .verdict{animation:stamp var(--t-stamp) var(--ease-stamp) both;
  animation-delay:calc(620ms * var(--t-scale))}
.verdict .seal{inline-size:15px;block-size:15px;flex:none}

/* ══════════════════════════════════════════════════════════════════════════
   5 · TABLES — the ledger rule
   Rows are ruled, not boxed. The leading column is the sigil column: it is the
   record's own margin repeated inside the table.
   ══════════════════════════════════════════════════════════════════════════ */
.tbl{font-size:var(--fs-1)}
.tbl caption{
  text-align:start;color:var(--ink-3);font-size:var(--fs-0);padding-block-end:6px;
  letter-spacing:.04em;
}
.tbl th{
  text-align:start;font-size:var(--fs-00);font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);padding:0 var(--sp-3) 5px 0;
  border-block-end:1px solid var(--rule-2);white-space:nowrap;
}
:root[lang="he"] .tbl th{text-transform:none;letter-spacing:0}
.tbl td{padding:3px var(--sp-3) 3px 0;border-block-end:1px solid var(--rule);vertical-align:top}
.tbl tr:last-child td{border-block-end:0}
.tbl .sig{inline-size:24px;padding-inline-end:6px}
.tbl tbody tr:hover td{background:var(--record-2)}

/* 24px minimum target — WCAG 2.5.8. The padding is on the CONTROL, not the
   cell, so the row does not grow and the record stays dense. */
.linkid{
  font-family:var(--mono);font-size:var(--fs-1);color:var(--ink);text-align:start;
  border-block-end:1px solid transparent;line-height:1.35;
  padding-block:3px;min-block-size:24px;
}
/* Interaction carries NO hue. The affordance is an inked underline that
   travels, which is the same gesture as every other mark on this page. */
.linkid::after{
  content:"";display:block;block-size:1px;background:var(--ink);
  transform:scaleX(0);transform-origin:var(--po) center;
  transition:transform 150ms var(--ease-pen);
}
.linkid:hover::after,.linkid:focus-visible::after,.linkid[aria-current="true"]::after{transform:scaleX(1)}
.linkid[aria-current="true"]{font-weight:600}

/* ── chips: a pen swatch and a word. No pill, no fill. ── */
.chip{
  display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:var(--fs-0);
  color:var(--ink-2);white-space:nowrap;
}
.chip::before{
  content:"";inline-size:7px;block-size:7px;flex:none;background:var(--pen);border-radius:1px;
}
.chip.gov{--pen:var(--gov)} .chip.del{--pen:var(--del)} .chip.def{--pen:var(--def)}
.chip.ref{--pen:var(--ref)} .chip.car{--pen:var(--car)}
/* Absence has no pen: its swatch is the hatch, hollow. */
.chip.absent{--pen:transparent}
.chip.absent::before{border:1px solid var(--hatch);background-image:repeating-linear-gradient(
  var(--hatch-a),var(--hatch) 0 1px,transparent 1px 3px)}

/* ══════════════════════════════════════════════════════════════════════════
   6 · THE GATE LADDER — the hero
   "The order is the explanation." The mockup says that in ninety words of
   caption because a static list cannot say it. Inked in select()'s own order,
   rung by rung, stopping dead at the gate that binds, the drawing says it.
   Everything below the failing rung never inks — it was NOT REACHED, which is
   a different fact from "passed" and a different fact from "failed".
   ══════════════════════════════════════════════════════════════════════════ */
.ladder{list-style:none;margin:0;padding:0;font-size:var(--fs-1)}
.rung{
  display:grid;grid-template-columns:30px minmax(92px,auto) 1fr;gap:var(--sp-2);
  align-items:start;padding-block:6px;position:relative;
}
.rung .n{
  font-family:var(--mono);font-size:var(--fs-0);color:var(--ink-3);padding-block-start:1px;
  white-space:nowrap;
}
.rung .nm{font-weight:600;color:var(--ink)}
.rung .q{grid-column:3;color:var(--ink-2);font-size:var(--fs-0);line-height:1.45}
/* the inked track, under the whole rung */
.rung .track{
  grid-column:1/-1;block-size:2px;margin-block-start:6px;background:var(--rule);
  position:relative;
}
.rung .track i{
  position:absolute;inset-block:0;inset-inline-start:0;inline-size:100%;background:var(--pen);
  transform:scaleX(1);transform-origin:var(--po) center;
}
/* A pass is not the news. The gate that BINDS is, so it is the heavier pen —
   and the only one whose travel stops short of the end of the track. */
.rung.pass .track{block-size:1px}
.rung.binds .track{block-size:3px}
.rung.after .track i{display:none}
.rung.pass{--pen:var(--del)}
.rung.pass .n{color:var(--del)}
.rung.binds{--pen:var(--ref)}
.rung.binds .n{color:var(--ref)}
.rung.binds .nm{color:var(--ref)}
.rung.binds .q{color:var(--ink)}
/* NOT REACHED — no ink at all, ever. The track shows the hatch. */
.rung.after .track{background-image:repeating-linear-gradient(
  var(--hatch-a),var(--hatch) 0 1px,transparent 1px 4px)}
.rung.after .nm,.rung.after .n{color:var(--ink-3)}
.rung.after .q{color:var(--ink-3)}
.rung.after .notreached{
  font-family:var(--mono);font-size:var(--fs-00);color:var(--hatch);
  border:1px solid var(--hatch);padding:0 3px;margin-inline-end:6px;border-radius:1px;
}
/* motion: the pen travels down the ladder in select()'s order */
.inking .rung .track i{
  animation:ink var(--t-ink) var(--ease-pen) both;
  animation-delay:calc(var(--d) * var(--t-scale));
}
.inking .rung .n,.inking .rung .nm,.inking .rung .q{
  animation:feed var(--t-rise) var(--ease-pen) both;
  animation-delay:calc(var(--d) * var(--t-scale));
}
/* the binding rung's diagnosis lands like a stamp */
.inking .rung.binds .q{animation:stamp var(--t-stamp) var(--ease-stamp) both;
  animation-delay:calc((var(--d) + 80ms) * var(--t-scale))}
/* the failing pen stops SHORT — the travel is truncated, not merely coloured */
.rung.binds .track i{inline-size:62%}

.segbar{display:flex;gap:0;flex-wrap:wrap;margin-block-end:var(--sp-3);
  border:1px solid var(--ctrl);inline-size:fit-content;max-inline-size:100%;border-radius:2px}
.segbar button{
  font-family:var(--mono);font-size:var(--fs-0);padding:5px 9px;color:var(--ink-2);
  border-inline-end:1px solid var(--ctrl);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-inline-size:22ch;
}
.segbar button:last-child{border-inline-end:0}
.segbar button[aria-pressed="true"]{background:var(--ink);color:var(--record)}

/* ══════════════════════════════════════════════════════════════════════════
   7 · THE BUDGET RIBBON
   One segment per admitted item at its real itemCost. Ghosts are the spilled
   items, at the width they would have taken, IN THE POSITION THE SELECTOR
   CONSIDERED THEM. The ink runs in first-fit order, so the animation IS the
   algorithm: fill, fill, ghost, fill.
   ══════════════════════════════════════════════════════════════════════════ */
.ribbon{margin-block-end:var(--sp-4)}
.runbody{overflow-x:clip}
.ribbon .rlbl{
  display:flex;align-items:baseline;gap:var(--sp-2);font-size:var(--fs-0);
  margin-block-end:4px;color:var(--ink-2);
}
.ribbon .rlbl b{font-family:var(--mono);font-size:var(--fs-1);color:var(--ink);font-weight:600}
.ribbon .rlbl .rnum{margin-inline-start:auto;font-family:var(--mono);color:var(--ink-3)}
.track2{
  display:flex;block-size:15px;background:var(--record-2);
  border:1px solid var(--ctrl);border-radius:2px;overflow:hidden;
}
.track2 > *{block-size:100%;flex:none}
.seg{background:var(--pen);position:relative;
  transform:scaleX(1);transform-origin:var(--po) center;
  border-inline-end:1px solid var(--record)}
.track2 > .free{flex:1 1 auto;min-inline-size:0}
.inking .seg{animation:ink var(--t-ink) var(--ease-pen) both;
  animation-delay:calc(var(--d) * var(--t-scale))}

/* THE GHOST LANE — beneath the track, never inside it. Every spilled item at
   the width it would have taken, positioned where the selector considered it.
   Drawn as a tail it would misrepresent first-fit; drawn here it IS first-fit. */
.ghostlane{display:flex;flex-direction:column;gap:1px;margin-block-start:3px}
.ghostlane .glane{position:relative;block-size:8px}
.ghostlane .g{
  position:absolute;inset-block:0;border:1px solid var(--hatch);border-radius:1px;
  background-image:repeating-linear-gradient(var(--hatch-a),var(--hatch) 0 1px,transparent 1px 5px);
}
.inking .ghostlane .g{animation:feed var(--t-rise) var(--ease-pen) both;
  animation-delay:calc(var(--d) * var(--t-scale))}
.ghostlane .nospill{
  font-family:var(--mono);font-size:var(--fs-00);color:var(--ink-3);opacity:.8;
  line-height:1}
/* a tier this event never reaches: absent, hatched AND NAMED. An empty track
   would claim it ran and delivered nothing, which is a different fact. */
.track2.absent{align-items:center;justify-content:center;
  background-image:repeating-linear-gradient(var(--hatch-a),var(--hatch) 0 1px,transparent 1px 6px)}
.track2.absent span{
  flex:0 0 auto;font-family:var(--mono);font-size:var(--fs-00);color:var(--ink-2);
  background:var(--record);padding:1px 7px;border:1px solid var(--ctrl);border-radius:1px;
}

/* ══════════════════════════════════════════════════════════════════════════
   8 · THE SIGIL — the signature element
   Every item carries a mark drawn deterministically from its checksum. It is
   not an ornament and not an avatar: a checksum is 64 characters nobody reads,
   and this is the same fact in a form a person can recognise across screens
   and, crucially, SEE CHANGE when the file on disk changes. Where the recorded
   checksum and the file on disk disagree, the two marks are drawn over each
   other and the disagreement is visible without reading a single hex digit.
   The form is borrowed from security engraving — a rose curve, machine-drawn,
   impossible to redraw by hand — which is what a checksum is for.
   ══════════════════════════════════════════════════════════════════════════ */
.sigil{display:block;color:var(--ink-3);opacity:.78;overflow:visible}
.sigil path,.sigil circle{fill:none;stroke:currentColor;vector-effect:non-scaling-stroke}
tr:hover .sigil,.sigil.lit{opacity:1;color:var(--pen,var(--ink))}
.sigil.drawing path{stroke-dasharray:var(--len);
  animation:draw var(--t-draw) var(--ease-pen) both;
  animation-delay:calc(var(--d,0ms) * var(--t-scale))}
.sigil.drift-recorded{color:var(--gov);opacity:1}
.sigil.drift-disk{color:var(--ref);opacity:1}
.sigil.drift-disk path{stroke-dasharray:2 2.5}
.driftstack{position:relative;inline-size:56px;block-size:56px;flex:none}
.driftstack > *{position:absolute;inset:0}

/* ══════════════════════════════════════════════════════════════════════════
   9 · AUDIT STREAM
   ══════════════════════════════════════════════════════════════════════════ */
.pulse{
  display:flex;align-items:stretch;gap:2px;block-size:52px;padding:0;
  border-block-end:1px solid var(--rule-2);margin-block-end:var(--sp-2);overflow:hidden;
}
.pulse .col{
  inline-size:8px;flex:none;block-size:100%;
  display:flex;flex-direction:column;justify-content:flex-end;gap:1px;
}
.pulse .col i{display:block;inline-size:100%;background:var(--pen);
  transform:scaleY(1);transform-origin:bottom}
.pulse .col.now i{animation:rise var(--t-rise) var(--ease-feed) both}
.inking .pulse .col i{animation:rise var(--t-rise) var(--ease-feed) both;
  animation-delay:calc(var(--d,0ms) * var(--t-scale))}
/* The column still filling. A recorder always has one, and drawing it as
   complete would be a claim about a bucket that has not closed. */
.pulse .col.now{opacity:.55}
.pulse .col.now::after{
  content:"";display:block;inline-size:100%;block-size:2px;background:var(--ink);
  margin-block-start:1px;flex:none}

.feedrow td{animation:feed var(--t-row) var(--ease-feed) both}
/* the newest row's rule inks across as it lands: the pen writing the line */
.feedrow .inkline{
  position:absolute;inset-inline:0;inset-block-end:-1px;block-size:1px;background:var(--ink);
  transform:scaleX(0);transform-origin:var(--po) center;
  animation:ink var(--t-row) var(--ease-feed) both;
}
#atbl tr{position:relative}
#atbl td{padding:5px var(--sp-3) 5px 0}

/* a focus change is a REGIME BOUNDARY, drawn across the whole feed */
.regime td{padding:0!important;border:0!important}
.regime .rw{
  display:flex;align-items:center;gap:var(--sp-2);padding-block:9px;
  font-size:var(--fs-0);color:var(--car);font-family:var(--mono);
}
.regime .ln{flex:1;block-size:0;border-block-start:1px dashed var(--car);opacity:.75}
.regime .dbl{block-size:3px;border-block:1px solid var(--car);inline-size:100%;opacity:.5}

.tokbar{block-size:5px;background:var(--gov);margin-block:3px 2px;max-inline-size:100%;
  transform:scaleX(1);transform-origin:var(--po) center;
  animation:ink var(--t-ink) var(--ease-pen) both}
.tokvoid{
  block-size:5px;margin-block:3px 2px;inline-size:100%;border:1px solid var(--hatch);
  background-image:repeating-linear-gradient(var(--hatch-a),var(--hatch) 0 1px,transparent 1px 4px);
}
.nt{font-size:var(--fs-00);color:var(--ink-3);font-family:var(--mono)}

/* ══════════════════════════════════════════════════════════════════════════
   10 · DETAIL PANE — where the corpus speaks
   ══════════════════════════════════════════════════════════════════════════ */
.pane{
  grid-area:pane;background:var(--band);border-inline-start:1px solid var(--rule-2);
  overflow-y:auto;padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3);
}
.pane[hidden]{display:none}
.pane dl{display:grid;grid-template-columns:auto 1fr;gap:3px var(--sp-3);margin:0;font-size:var(--fs-0)}
.pane dt{color:var(--ink-3);font-size:var(--fs-00);letter-spacing:.11em;text-transform:uppercase}
:root[lang="he"] .pane dt{text-transform:none;letter-spacing:0}
.pane dd{margin:0;font-family:var(--mono);font-size:var(--fs-0);color:var(--ink);
  font-variant-numeric:tabular-nums slashed-zero;direction:ltr;unicode-bidi:isolate}
.welllabel{
  font-size:var(--fs-00);font-weight:600;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink-3);border-block-end:1px solid var(--rule-2);padding-block-end:4px;
}
.well{
  background:var(--well);border:1px solid var(--rule);padding:var(--sp-3) var(--sp-4);
  border-radius:2px;
}
/* twelve weekly buckets — hatched where spilled, plain grey where nothing was
   delivered, inked where it was. Absence again, same mark. */
.spark{display:flex;align-items:flex-end;gap:3px;block-size:34px}
.spark i{flex:1;background:var(--del);transform:scaleY(1);transform-origin:bottom;
  animation:rise var(--t-rise) var(--ease-pen) both;
  animation-delay:calc(var(--d,0ms) * var(--t-scale))}
.spark i.sp{background:transparent;border:1px solid var(--hatch);
  background-image:repeating-linear-gradient(var(--hatch-a),var(--hatch) 0 1px,transparent 1px 4px)}
.spark i.no{background:var(--rule)}

/* ══════════════════════════════════════════════════════════════════════════
   11 · PROVENANCE BAR + STRIP
   The bar is the product's soul: every figure says where it came from. Here it
   is the instrument's status line — a ruled band, pen swatches, mono.
   ══════════════════════════════════════════════════════════════════════════ */
.prov{
  grid-area:prov;background:var(--band);border-block-start:1px solid var(--rule-2);
  display:flex;align-items:center;gap:var(--sp-2);padding-inline:var(--sp-3);
  font-family:var(--mono);font-size:var(--fs-00);color:var(--ink-2);overflow:hidden;
  white-space:nowrap;
}
.strip{
  grid-area:strip;background:var(--band);border-block-start:1px solid var(--rule-2);
  display:flex;align-items:center;gap:var(--sp-2);padding-inline:var(--sp-3);
  font-size:var(--fs-0);color:var(--ink-2);overflow:hidden;white-space:nowrap;
}
.sep{inline-size:1px;block-size:12px;background:var(--rule-2);flex:none;margin-inline:2px}
/* The accountant's rule convention, and it is not decoration: a single rule
   under a figure means the figure is still running; a DOUBLE rule means the
   procedure is complete and no further entry will be posted against it. The
   one measured number in this product is exactly that. Nothing else gets it. */
.measured{color:var(--del);font-weight:600;
  border-block-end:3px double var(--del);padding-block-end:1px;line-height:1.1}
.prov .lbl{color:var(--ink-3)}

/* ══════════════════════════════════════════════════════════════════════════
   12 · DEGRADATION — the depth cue moves from PAINT to EDGE
   ══════════════════════════════════════════════════════════════════════════ */
@media (prefers-contrast:more){
  :root{--rule:var(--ink-3);--rule-2:var(--ink);--ctrl:var(--ink);--hatch:var(--ink)}
  .sigil{opacity:1}
}
@media (forced-colors:active){
  .chip::before,.seg,.rung .track i,.tokbar,.spark i{forced-color-adjust:none}
  .hatched,.ghost,.tokvoid,.track2.absent{background-image:none;border:1px dashed CanvasText}
  .rec::before,.pane,.rail,.prov{background:Canvas;border-color:CanvasText}
  .sigil{color:CanvasText;opacity:1}
}
@media print{
  body{overflow:visible;background:#fff}
  .app{display:block;block-size:auto}
  .rail,.top,.icon,.segbar{display:none}
  .screen[hidden]{display:block!important}
  .rec::before{display:none}
  *{animation:none!important;transform:none!important}
  .seg,.rung .track i,.tokbar,.spark i{transform:none!important}
}

/* ══════════════════════════════════════════════════════════════════════════
   13 · DEMO SCAFFOLD — not part of the direction
   ══════════════════════════════════════════════════════════════════════════ */
.demoflag{
  font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;color:var(--ink-3);
  border:1px dashed var(--ctrl);padding:0 4px;border-radius:1px;
}
@media (max-inline-size:1100px){
  .app.pane-open{grid-template-columns:206px 1fr;
    grid-template-areas:"top top" "rail rec" "prov prov" "strip strip"}
  .app.pane-open .pane{display:none}
}
@media (max-inline-size:760px){
  .app,.app.pane-open{grid-template-columns:1fr;
    grid-template-areas:"top" "rec" "prov" "strip"}
  .rail{display:none}
}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ══ head ═══════════════════════════════════════════════════════════════
       The mark is a pen at rest on a ruled line. Not a monogram, not a glyph
       in a rounded square: the product's whole claim is that it only ever
       records, so its mark is the instrument that records.
       ══════════════════════════════════════════════════════════════════════ -->
  <header class="top">
    <span class="logo">
      <svg class="pen" viewBox="0 0 18 18" aria-hidden="true">
        <path d="M4.2 1.6 L7.4 1.6 L6.6 10.4 L5.8 12.4 L5 10.4 Z"
              fill="currentColor"/>
        <path d="M5.8 12.4 L5.8 14.2" stroke="currentColor" stroke-width="1.1"/>
        <path d="M0.5 15.6 H17.5" stroke="currentColor" stroke-width="1"
              opacity=".45"/>
        <path d="M9.4 15.6 C11.2 15.6 12 13.4 13.4 13.4 C14.8 13.4 15.6 15.6 17.5 15.6"
              stroke="currentColor" stroke-width="1.1" fill="none" opacity=".45"/>
      </svg>
      <span class="nm">mycontext</span><span class="vr">2.0</span>
    </span>
    <span class="sep"></span>
    <span class="m" style="font-size:10.5px;color:var(--ink-3)">
      <span data-t="top.session"></span> <span class="m">a3f9c1 · billing-refactor</span>
      &nbsp;·&nbsp; <span data-t="top.focus"></span> <span class="m">tag:billing</span>
    </span>

    <span class="spacer"></span>
    <button class="icon" id="replay" title="Re-run the selection">
      <svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="1.3">
        <path d="M10 6a4 4 0 1 1-1.3-2.9"/><path d="M10.6 1v3H7.7"/>
      </svg>
      <span data-t="demo.replay"></span>
    </button>
    <button class="icon" id="stillbtn" aria-pressed="false" title="Hold the pen still">
      <span data-t="demo.still"></span>
    </button>
    <button class="icon" id="lang" title="English / עברית"><span class="v"
       style="direction:ltr">א&#8202;/&#8202;A</span></button>
    <button class="icon" id="theme" data-t-title="title.theme" title="Theme">◐</button>
  </header>

  <!-- ══ rail ══════════════════════════════════════════════════════════════ -->
  <nav class="rail" aria-label="Screens" data-t-aria="aria.rail">
    <div class="grp"><p data-t="nav.inj"></p>
      <button class="nav" data-s="preview" aria-current="page"><span data-t="s.preview"></span></button>
      <button class="nav" data-s="x"><span data-t="s.coverage"></span></button>
      <button class="nav" data-s="x"><span data-t="s.gaps"></span><span class="cnt">7</span></button>
      <button class="nav" data-s="x"><span data-t="s.simulate"></span></button>
      <button class="nav" data-s="x"><span data-t="s.injected"></span></button>
    </div>
    <div class="grp"><p data-t="nav.ev"></p>
      <button class="nav" data-s="watch"><span data-t="s.watch"></span></button>
      <button class="nav" data-s="x"><span data-t="s.ask"></span></button>
      <button class="nav" data-s="x"><span data-t="s.doctor"></span><span class="cnt">2</span></button>
      <button class="nav" data-s="x"><span data-t="s.decay"></span></button>
      <button class="nav" data-s="x"><span data-t="s.graph"></span></button>
      <button class="nav" data-s="x"><span data-t="s.status"></span></button>
    </div>
    <div class="grp"><p data-t="nav.ch"></p>
      <button class="nav" data-s="x"><span data-t="s.work"></span><span class="cnt">3</span></button>
      <button class="nav" data-s="x"><span data-t="s.capture"></span></button>
      <button class="nav" data-s="x"><span data-t="s.palette"></span></button>
      <button class="nav" data-s="x"><span data-t="s.config"></span></button>
      <button class="nav" data-s="x"><span data-t="s.proc"></span><span class="prop">PROPOSED</span></button>
      <button class="nav" data-s="x"><span data-t="s.port"></span><span class="prop">PROPOSED</span></button>
    </div>
    <div class="grp"><p data-t="nav.read"></p>
      <button class="nav" data-s="x"><span data-t="s.docs"></span></button>
      <button class="nav" data-s="x"><span data-t="s.tut"></span></button>
      <button class="nav" data-s="x"><span data-t="s.learn"></span></button>
    </div>
  </nav>

  <main class="rec" id="rec">

  <!-- ═══ SCREEN 1 · INJECTION PREVIEW ══════════════════════════════════════ -->
  <section class="screen" data-p="preview">
    <div class="phd">
      <h2 data-t="preview.h"></h2>
      <span class="verdict">
        <svg class="seal" viewBox="0 0 16 16" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="1.3">
          <circle cx="8" cy="8" r="6.6" opacity=".5"/><path d="M4.8 8.2 6.9 10.4 11.2 5.8"/>
        </svg>
        <span data-t="preview.v"></span>
      </span>
    </div>
    <p class="psub" data-t="preview.sub"></p>

    <!-- run 1 · event -->
    <div class="run" style="--pen:var(--ink-3);--d:60ms">
      <div class="runhead"><i></i><span class="lbl" data-t="preview.ev"></span>
        <span class="src">hook · SessionStart</span></div>
      <div class="runbody">
        <div style="display:flex;gap:var(--sp-3);flex-wrap:wrap;align-items:center">
          <label class="m" style="font-size:11px;color:var(--ink-3)" for="evsel"
                 data-t="preview.evl"></label>
          <select id="evsel" class="icon" style="inline-size:auto;padding-inline:6px">
            <option>session-start</option><option>tool</option>
            <option>compact</option><option>manual</option>
          </select>
          <span class="m" style="font-size:11px;color:var(--ink-3)">path — none (session-start takes none)</span>
        </div>
        <p class="note"><b data-t="help.p1"></b> <span data-t="help.p2"></span></p>
      </div>
    </div>

    <!-- run 2 · what arrived, and why the rest did not — THE HERO -->
    <div class="run" style="--pen:var(--del);--d:150ms">
      <div class="runbody two" style="padding-block-start:0">
        <div>
          <div class="subhead"><i></i><span class="lbl" data-t="preview.delivered"></span>
            <span class="src">select() · 09:14:02</span></div>
          <table class="tbl" id="deltbl">
            <caption data-t="preview.cap"></caption>
            <thead><tr><th class="sig"></th><th data-t="th.item"></th><th data-t="th.tier"></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div style="--pen:var(--ref)">
          <div class="subhead"><i></i><span class="lbl" data-t="preview.why"></span>
            <span class="src">injection() · select() order</span></div>
          <div class="segbar" id="gatepick" role="group" aria-label="Item" data-t-aria="aria.gatepick"></div>
          <ol class="ladder" id="gates"></ol>
        </div>
      </div>
      <div class="runbody" style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:var(--sp-6);align-items:start">
        <p class="note" data-t="preview.carried"></p>
        <p class="note" data-t="preview.whyn"></p>
      </div>
    </div>

    <!-- run 4 · budget ribbon -->
    <div class="run" style="--pen:var(--gov);--d:330ms">
      <div class="runhead"><i></i><span class="lbl" data-t="preview.ribbon"></span>
        <span class="src">itemCost() · first-fit</span></div>
      <div class="runbody">
        <div id="ribbons"></div>
        <p class="note" data-t="preview.ribbonn"></p>
      </div>
    </div>
  </section>

  <!-- ═══ SCREEN 2 · AUDIT STREAM ═══════════════════════════════════════════ -->
  <section class="screen" data-p="watch" hidden>
    <div class="phd">
      <h2 data-t="watch.h"></h2>
      <span class="verdict">
        <svg class="seal" viewBox="0 0 16 16" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="1.3">
          <circle cx="8" cy="8" r="6.6" opacity=".5"/><path d="M4.8 8.2 6.9 10.4 11.2 5.8"/>
        </svg>
        <span data-t="watch.v"></span>
      </span>
    </div>
    <p class="psub" data-t="watch.sub"></p>

    <div class="run" style="--pen:var(--ink-3);--d:60ms">
      <div class="runhead"><i></i><span class="lbl" data-t="watch.pulse"></span>
        <span class="src">idx_audit_at · 10 s buckets</span></div>
      <div class="runbody">
        <div class="pulse" id="pulse" role="img" aria-label="Activity pulse"></div>
        <p class="note" data-t="watch.pulsen"></p>
      </div>
    </div>

    <div class="run" style="--pen:var(--del);--d:150ms">
      <div class="runhead"><i></i><span class="lbl" data-t="watch.records"></span>
        <span class="src" id="feedsrc">audit.jsonl · tail -f</span></div>
      <div class="runbody">
        <div style="display:flex;gap:0;flex-wrap:wrap;margin-block-end:var(--sp-3);
                    border:1px solid var(--rule-2);inline-size:fit-content;border-radius:2px"
             id="wfilters" class="segbar" role="group" aria-label="Filter" data-t-aria="aria.wfilters">
          <button data-k="all" aria-pressed="true" data-t="watch.all"></button>
        </div>
        <table class="tbl">
          <thead><tr><th class="sig"></th><th data-t="th.at"></th><th data-t="th.kind"></th>
            <th data-t="th.what"></th></tr></thead>
          <tbody id="atbl"></tbody>
        </table>
        <p class="note" aria-live="polite" id="alive"></p>
        <p class="note" data-t="watch.voidn"></p>
      </div>
    </div>
  </section>

  </main>

  <!-- ══ detail pane — where the CORPUS speaks ═════════════════════════════ -->
  <aside class="pane" id="pane" hidden aria-label="Item detail" data-t-aria="aria.pane">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:var(--sp-2)">
      <div style="display:flex;gap:var(--sp-3);align-items:flex-start;min-inline-size:0">
        <span class="driftstack" id="panesig"></span>
        <div style="min-inline-size:0">
          <h3 class="m" id="paneid" style="overflow-wrap:break-word">—</h3>
          <p class="m" id="panesum" style="font-size:9.5px;color:var(--ink-3)"></p>
        </div>
      </div>
      <button class="icon" id="paneclose" aria-label="Close" data-t-aria="aria.paneclose">✕</button>
    </div>

    <p id="panedrift" hidden style="font-size:11px;color:var(--ref);
       border-inline-start:2px solid var(--ref);padding-inline-start:8px"></p>

    <dl>
      <dt data-t="pane.type"></dt>   <dd class="m" id="panetype"></dd>
      <dt data-t="pane.status"></dt> <dd class="m" id="panestatus"></dd>
      <dt data-t="pane.tier"></dt>   <dd class="m" id="panetier"></dd>
      <dt data-t="pane.scope"></dt>  <dd class="m" id="panescope"></dd>
      <dt data-t="pane.file"></dt>   <dd class="m" id="panefile" style="overflow-wrap:break-word"></dd>
    </dl>

    <div>
      <div class="welllabel" data-t="pane.hist"></div>
      <div class="spark" id="panespark" style="margin-block-start:8px"></div>
    </div>

    <div>
      <div class="welllabel" data-t="pane.body"></div>
      <div class="well" style="margin-block-start:8px">
        <div class="corpus" id="panebody"><bdi></bdi></div>
      </div>
      <p class="note" data-t="pane.well" style="margin-block-start:8px;border:0;padding:0"></p>
    </div>
  </aside>

  <!-- ══ provenance bar ═══════════════════════════════════════════════════ -->
  <div class="prov" aria-label="Provenance" data-t-aria="aria.prov">
    <span class="chip car" style="font-size:9.5px"></span>
    <span data-t="prov.parent"></span>
    <span class="sep"></span><span class="lbl" data-t="prov.focus"></span>
    <span class="sep"></span><span class="lbl">projection</span>
    <span class="chip del" style="font-size:9.5px" data-t="prov.projFresh"></span>
  </div>

  <footer class="strip">
    <span data-t="strip.branch"></span>
    <span class="sep"></span>
    <span class="chip del" data-t="strip.inSync"></span>
    <span class="sep"></span>
    <span class="m">43</span>&nbsp;<span data-t="strip.items"></span>
    <span class="sep"></span>
    <span class="m">128</span>&nbsp;<span data-t="strip.inj"></span>
    <span class="sep"></span>
    <span class="m measured">0.55 ms</span>&nbsp;<span data-t="strip.append"></span>
    <span class="chip del" data-t="strip.meas"></span>
    <span class="spacer"></span>
    <span class="demoflag" id="demoflag"></span>
  </footer>
</div>
<script>
/* ══════════════════════════════════════════════════════════════════════════
   DIRECTION C — "INK ORDER"

   Everything below is either (a) fixture data copied verbatim out of
   docs/design/web-ui-mockup.html, or (b) the machinery the direction needs.
   Nothing is invented product content and no string is machine-translated.

   The string mechanism is the SHIPPED ONE, deliberately: `data-t`,
   `data-t-aria`, `data-t-title`, `{m:…}` for machine literals, `{v:name=…}`
   for value slots, `{mv:…}` for both. This prototype adds no new key
   categories, and its two screens need no new keys except the demo controls
   (`demo.replay`, `demo.still`) and one that FIXES an existing defect:
   `gate.notReached`, which the mockup builds behind a `HEB ? … : …` ternary
   no string table can see.
   ══════════════════════════════════════════════════════════════════════════ */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;
  if(x!==undefined)e.textContent=x;return e;};
const num=n=>n.toLocaleString('en-US');

/* ── 1 · STRINGS ─────────────────────────────────────────────────────────────
   [English, Hebrew]. Every Hebrew value is lifted key-for-key from the HE
   table in the mockup. ── */
const T={
'top.session':['session','שיחה'],
'top.focus':['focus','מיקוד'],
'nav.inj':['Injection — what arrives','הזרקה — מה מגיע'],
'nav.ev':["Evidence — why it did or didn't",'ראיות — למה כן או לא'],
'nav.ch':['Change — composed, never run','שינוי — מורכב, לא מורץ'],
'nav.read':['Read','קריאה'],
's.preview':['Injection preview','תצוגת הזרקה'],
's.coverage':['Scope coverage','כיסוי היקף'],
's.gaps':['Coverage gaps','פערי כיסוי'],
's.simulate':['Budget simulator','סימולטור תקציב'],
's.injected':['Injected now','מוזרק כעת'],
's.watch':['Audit stream','זרם ביקורת'],
's.ask':['Ask','שאילתה'],
's.doctor':['Doctor','אבחון'],
's.decay':['Decay','דעיכה'],
's.graph':['Relations','קשרים'],
's.status':['Status','מצב'],
's.work':['Review queue','תור סקירה'],
's.capture':['Capture','תיעוד'],
's.palette':['Composer','מרכיב פקודות'],
's.config':['Configure','הגדרות'],
's.proc':['Procedures','נהלים'],
's.port':['Export / import','ייצוא / ייבוא'],
's.docs':['Documentation','תיעוד'],
's.tut':['Tutorials','מדריכים'],
's.learn':['Learn','לימוד'],

'preview.h':['Injection preview','תצוגת הזרקה'],
'preview.v':['exactly what Claude gets','בדיוק מה ש‑Claude מקבל'],
'preview.sub':['What the most recent session was given at its start. Pick a file to preview a tool event instead; the session and focus above narrow this the way the hook does.',
 'מה שהשיחה האחרונה קיבלה בתחילתה. בחרו קובץ כדי לראות אירוע כלי במקום.'],
'preview.ev':['Event','אירוע'],
'preview.evl':['Event','אירוע'],
'preview.delivered':['Delivered','נמסר'],
'preview.why':['Why not — the first gate that failed','למה לא — השער הראשון שנכשל'],
'preview.ribbon':['Budget ribbon — four tiers, and what fell out of each','סרט התקציב — ארבע רמות, ומה נשר מכל אחת'],
'preview.cap':['{v:items=4} items, {v:used=4,260} of {v:budget=6,000} tokens',
 '{v:items=4} פריטים, {v:used=4,260} מתוך {v:budget=6,000} אסימונים'],
'preview.carried':['{b:{v:lines=3} index lines carried from session} {mv:session=a3f9c1 · billing-refactor}. Shown here and in {m:mycontext context} identically — an item arriving from somewhere you cannot see is the same defect as one dropped silently, pointed the other way.',

/* A FRESH regex per call. `render` recurses for a nested {b:...}, and a shared
   /g regex would have its lastIndex reset by the inner call — an infinite loop
   that hangs the tab on the first nested marker. */
const RXSRC='\\{(m|v|mv|b):((?:[^{}]|\\{[^}]*\\})*)\\}';
function render(tpl){
  const RX=new RegExp(RXSRC,'g');
  const f=document.createDocumentFragment(); let last=0,mm;
  while((mm=RX.exec(tpl))){
    if(mm.index>last) f.append(tpl.slice(last,mm.index));
    const kind=mm[1], p=mm[2];
    if(kind==='b'){ const b=el('b'); b.append(render(p)); f.append(b); }
    else{
      const s=document.createElement('span');
      if(kind==='m'){ s.className='m'; s.textContent=p; }
      else{ const eq=p.indexOf('='); s.className=kind==='mv'?'m v':'v';
            s.textContent = eq<0?p:p.slice(eq+1); }
      f.append(s);
    }
    last=mm.index+mm[0].length;
  }
  if(last<tpl.length) f.append(tpl.slice(last));
  return f;
}

/* ── 2 · THE SIGIL ───────────────────────────────────────────────────────────
   A mark drawn deterministically from an item's checksum, in the language of
   security engraving: a rose curve, r = cos(kθ/d), machine-drawn and not
   redrawable by hand — which is what a checksum is for. Same content, same
   mark, on every screen. Different content, visibly different mark.
   ── */
function fnv(s){let h=2166136261>>>0;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
  return h>>>0;}
function gcd(a,b){while(b){const t=b;b=a%b;a=t;}return a;}
function sigil(seed,size,cls){
  /* Guilloche, in its dimensionless spirograph form — the curve a rose engine
     cuts into a share certificate, and the reason a certificate cannot be
     redrawn by hand:
         x(t) = R[(1-k)cos t + l*k*cos((1-k)/k * t)]
         y(t) = R[(1-k)sin t - l*k*sin((1-k)/k * t)]
     k and l come straight out of the checksum, so the mark IS the checksum. */
  const h=fnv(seed);
  const q=6+(h%5);                       /* 6..10 lobes */
  let pn=1+((h>>>4)%(q-2));              /* co-prime numerator */
  while(gcd(pn,q)!==1) pn=pn%(q-1)+1;
  const k=pn/q, l=0.46+((h>>>9)%46)/100;
  const ph=((h>>>17)%24)/24*Math.PI*2;
  const R=size/2-1.1, C=size/2;
  const N=Math.min(320,q*34), turns=2*Math.PI*pn;
  let p='';
  for(let i=0;i<=N;i++){
    const th=i/N*turns+ph;
    const x=R*((1-k)*Math.cos(th)+l*k*Math.cos((1-k)/k*th));
    const y=R*((1-k)*Math.sin(th)-l*k*Math.sin((1-k)/k*th));
    p+=(i?'L':'M')+(C+x).toFixed(2)+' '+(C+y).toFixed(2);
  }
  const NS='http://www.w3.org/2000/svg';
  const s=document.createElementNS(NS,'svg');
  s.setAttribute('viewBox','0 0 '+size+' '+size);
  s.setAttribute('width',size); s.setAttribute('height',size);
  s.setAttribute('aria-hidden','true');
  s.setAttribute('class','sigil'+(cls?' '+cls:''));
  const ring=document.createElementNS(NS,'circle');
  ring.setAttribute('cx',C); ring.setAttribute('cy',C);
  ring.setAttribute('r',(size/2-0.5).toFixed(2));
  ring.setAttribute('stroke-width','.5'); ring.setAttribute('opacity','.45');
  const path=document.createElementNS(NS,'path');
  path.setAttribute('d',p); path.setAttribute('stroke-width',size>28?'.75':'.6');
  path.setAttribute('stroke-linejoin','round');
  s.append(ring,path);
  return s;
}
function armDraw(svg,delay){
  const p=svg.querySelector('path');
  requestAnimationFrame(()=>{
    let L=0; try{L=p.getTotalLength();}catch(e){L=600;}
    svg.style.setProperty('--len',(L||600).toFixed(0));
    svg.style.setProperty('--d',delay+'ms');
    svg.classList.add('drawing');
  });
}

function fitFirstFit(cands,budget){
  let used=0; const fit=[],spill=[];
  for(const [id,cost] of cands){
    if(used+cost>budget){ spill.push({id,cost,at:used}); continue; }
    fit.push({id,cost,at:used}); used+=cost;
  }
  return {fit,spill,used};
}

    }
    const {fit,spill,used}=fitFirstFit(CANDIDATES[tier],budget);
    lbl.append(el('span','chip del',fit.length+(HEB?' מתוך ':' of ')+CANDIDATES[tier].length));
    lbl.append(el('span','rnum',num(used)+' / '+num(budget)));
    wrap.append(lbl);
    const tk=el('div','track2');
    fit.forEach(f=>{
      const s=el('div','seg');
      s.style.setProperty('--pen','var(--'+(tier==='pinned'?'gov':'del')+')');
      s.style.setProperty('inline-size',(f.cost/budget*100).toFixed(2)+'%');
      s.style.setProperty('--d',(880+(n++)*50)+'ms');
      s.title=f.id+' · '+num(f.cost);
      tk.append(s);
    });
    tk.append(el('div','free'));
    wrap.append(tk);
    /* the GHOST LANE — spilled items at the width they would have taken, in
       the position the selector considered them. Not a tail. */
    const lane=el('div','ghostlane');
    spill.forEach(g=>{
      const lane2=el('div','glane');
      const d=el('div','g');
      d.style.setProperty('inset-inline-start',Math.min(99,g.at/budget*100).toFixed(2)+'%');
      d.style.setProperty('inline-size',Math.min(100,g.cost/budget*100).toFixed(2)+'%');
      d.style.setProperty('--d',(880+(n++)*50)+'ms');
      d.title=g.id+' · '+num(g.cost)+(HEB?' — נשפך':' — spilled');
      lane2.append(d); lane.append(lane2);
    });
    if(!spill.length) lane.append(el('span','nospill',HEB?'לא נשפך דבר':'nothing spilled'));
    wrap.append(lane);
    host.append(wrap);
  }
}

/* ── 7 · AUDIT STREAM ────────────────────────────────────────────────────── */
let kind='all', ROWS=REC.slice(), feedI=0, clock=Date.now();
function rowPart(key,vals,cls,tag){
  const w=el(tag||'span',cls||null);
  w.append(render(t(key)));
  const slots=[...w.querySelectorAll('.v')], keys=Object.keys(vals||{});
  slots.forEach((s,i)=>{ if(keys[i]!==undefined) s.textContent=vals[keys[i]]; });
  return w;
}
function renderAudit(k){
  kind=k; const tb=$('#atbl'); tb.replaceChildren();
  const rows=ROWS.filter(r=>k==='all'||r[1]===k);
  rows.forEach(([at,kk,w,tok],i)=>{
    if(kk==='focus'){
      /* a regime change is not a row: everything below it was selected from a
         different corpus, so the series either side is not comparable. */
      const r=el('tr','regime'); const c=el('td'); c.colSpan=4;
      const rw=el('div','rw');
      rw.append(el('span',null,'◇'),el('span',null,t('watch.regime')+' · '+w),
                el('span','ln'),el('span','m',at));
      c.append(rw); r.append(c); tb.append(r); return;
    }
    const r=el('tr',i===0&&ROWS.length>REC.length?'feedrow':null);
    const c0=el('td','sig');
    const named=(typeof w==='string')&&w.match(/\b([A-Z]{2,6}-[a-z0-9][a-z0-9-]+)/);
    if(named) c0.append(sigil(named[1],15));
    const c1=el('td','m'); c1.style.fontSize='10.5px'; c1.textContent=at;
    const c2=el('td'); c2.append(el('span','chip '+KPEN[kk],kk));
    const c3=el('td');
    if(kk==='injection'){
      c3.append(rowPart('watch.delivered',{delivered:w[0]}),
                document.createTextNode(', '),
                rowPart('watch.spilled',{spilled:w[1]}));
      if(tok===null){
        /* a HATCHED VOID, and it says so. A zero-length bar would be a claim
           the record does not make. */
        c3.append(el('div','tokvoid'), rowPart('watch.tokensNotRecorded',{},'nt','div'));
      }else{
        const b=el('div','tokbar');
        b.style.setProperty('inline-size',Math.min(100,tok/6000*100).toFixed(1)+'%');
        c3.append(b, rowPart('watch.tokens',{tokens:num(tok)},'nt','div'));
      }
    }else{ const b=document.createElement('bdi'); b.textContent=w; c3.append(b);
           c3.style.fontSize='11.5px'; }
    r.append(c0,c1,c2,c3);
    /* the pen writing the new line: an inked rule under the arriving row.
       It lives inside a cell, because a <span> child of <tr> is not markup. */
    if(r.className==='feedrow') c3.append(el('span','inkline'));
    tb.append(r);
  });
  $('#alive').replaceChildren(rowPart('watch.shown',{records:rows.length}));
}
/* the kind filters, one per member of AUDIT_KINDS — derived, never hand-written */
for(const k of AUDIT_KINDS){
  const b=el('button',null,k); b.type='button'; b.dataset.k=k;
  b.setAttribute('aria-pressed','false'); $('#wfilters').append(b);
}
$('#wfilters').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  $$('#wfilters button').forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true'); renderAudit(b.dataset.k);
});

/* ── the pulse: one column per ten seconds, newest at the reading-end edge.
      The last column is the one still filling — a recorder always has a
      partial column, and drawing it as complete would be a claim. ── */
const NCOL=42;
const PULSE=[];
(function seed(){
  const mix=['hook','injection','progress','mutation','hook','injection','access'];
  for(let i=0;i<NCOL;i++){
    const c={}; const n=(i*7+3)%5;
    for(let j=0;j<n;j++){const k=mix[(i*3+j)%mix.length]; c[k]=(c[k]||0)+1;}
    PULSE.push(c);
  }
})();
function renderPulse(stagger){
  const host=$('#pulse'); host.replaceChildren();
  const max=6;
  PULSE.forEach((c,i)=>{
    const col=el('div','col'+(i===PULSE.length-1?' now':''));
    for(const k of AUDIT_KINDS){
      if(!c[k])continue;
      const b=el('i'); b.style.setProperty('--pen','var(--'+KPEN[k]+')');
      b.style.setProperty('block-size',(Math.min(c[k],max)/max*100).toFixed(1)+'%');
      if(stagger) b.style.setProperty('--d',(i*7)+'ms');
      col.append(b);
    }
    host.append(col);
  });
}

/* ── 8 · THE DETAIL PANE — where the corpus speaks ───────────────────────────
   Two typographic voices, and the rule that separates them is the product's
   own: the corpus sits in a well, in the book face; the product's words never
   do. Note RULE-never-log-customer-email: its body was authored in Hebrew and
   stays Hebrew inside the English UI, isolated in <bdi>. That is the case the
   mockup's <bdi> rule exists for, and it is the case nobody ever shows.
   ── */
const ITEMS={
 'CONST-postgres-pool-capped-at-20':{type:'constraint',status:'active',tier:'pinned',
   scope:'always:true',file:'.mycontext/items/CONST-postgres-pool-capped-at-20.md',
   sum:'sha256:4c1e…9ab3',
   body:'The Postgres connection pool is capped at 20. Above that the primary starts refusing connections during migration windows, and the failure surfaces as a timeout in an unrelated request, three services away. Any change to this number requires a load test against the staging primary — not a reasoned argument.',
   spark:[3,4,2,4,4,3,'sp',4,2,'no',3,4]},
 'CONST-zero-runtime-dependencies':{type:'constraint',status:'active',tier:'pinned',
   scope:'always:true',file:'.mycontext/items/CONST-zero-runtime-dependencies.md',
   sum:'sha256:8f70…1d42', drift:'sha256:b2a9…77c0',
   body:'The CLI, the MCP server and the hooks ship with no runtime dependencies. Every dependency is a thing a user has to trust, a thing that can be yanked, and a thing that turns a one-file install into a supply chain. UI assets are the single exception, because the browser is already a runtime and the code it loads never runs on a developer machine outside the tab.',
   spark:[4,4,4,3,4,4,4,'sp','sp',4,4,4]},
 'RULE-never-log-customer-email':{type:'rule',status:'active',tier:'jit',
   scope:'src/**',file:'.mycontext/items/RULE-never-log-customer-email.md',
   sum:'sha256:2ad4…6e18',
   body:'לעולם אין לרשום כתובת דואר אלקטרוני של לקוח ליומן — לא ברמת debug, לא בהודעת שגיאה, ולא בתוך אובייקט שנשלח כולו ל‑logger. כתובת היא מזהה אישי, והיומנים נשמרים שנה. במקום הכתובת יש לרשום את מזהה הלקוח.',
   spark:[2,3,'sp',3,4,2,3,3,'no','no',2,3]},
 'INV-prices-are-integer-cents':{type:'invariant',status:'active',tier:'jit',
   scope:'src/billing/**',file:'.mycontext/items/INV-prices-are-integer-cents.md',
   sum:'sha256:9c33…40be',
   body:'Every price in this system is an integer number of cents. There is no float anywhere in the money path, no Decimal wrapper, and no currency-minor-unit lookup: the invariant is that the number you read is cents, and it is enforced at the schema boundary rather than in each call site.',
   spark:[1,2,2,'sp',3,2,2,'no',2,3,2,2]},
 'ADR-markdown-plus-disposable-index':{type:'decision',status:'active',tier:'carried',
   scope:'always:true',file:'.mycontext/items/ADR-markdown-plus-disposable-index.md',
   sum:'sha256:71bc…c5d9',
   body:'Markdown on disk is the source of truth; the index is disposable and can be rebuilt from the files at any time. This is what makes the corpus reviewable in a pull request, greppable without the tool, and survivable if the tool is deleted. The index exists only so that a question can be answered in milliseconds instead of seconds.',
   spark:['no','no',1,'no',1,'no','no',1,'no','no','no',1]}
};
let PANE=null;
function openPane(id){ PANE=id; $('#app').classList.add('pane-open'); $('#pane').hidden=false;
  $$('.linkid').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===id)));
  renderPane(); }
function renderPane(){
  if(!PANE) return; const it=ITEMS[PANE]; if(!it) return;
  $('#paneid').textContent=PANE;
  $('#panesum').textContent=it.sum;
  const stack=$('#panesig'); stack.replaceChildren();
  const a=sigil(it.sum,56,'drift-recorded'); stack.append(a); armDraw(a,60);
  const dr=$('#panedrift');
  if(it.drift){ const b=sigil(it.drift,56,'drift-disk'); stack.append(b); armDraw(b,240);
    dr.hidden=false; dr.replaceChildren(render(t('pane.drift')));
  } else dr.hidden=true;
  $('#panetype').textContent=it.type; $('#panestatus').textContent=it.status;
  $('#panetier').textContent=it.tier; $('#panescope').textContent=it.scope;
  $('#panefile').textContent=it.file;
  const sp=$('#panespark'); sp.replaceChildren();
  it.spark.forEach((v,i)=>{
    const b=el('i',v==='sp'?'sp':v==='no'?'no':null);
    b.style.setProperty('block-size',(v==='sp'||v==='no')?'26%':(v/4*100)+'%');
    b.style.setProperty('--d',(i*26)+'ms');
    sp.append(b);
  });
  const bd=$('#panebody'); bd.replaceChildren();
  /* dir="auto" on the BLOCK, not only <bdi> on the run: <bdi> isolates the
     ordering but alignment comes from the block, so an English rule in a
     Hebrew UI would set ragged-left against the wrong margin. */
  bd.setAttribute('dir','auto');
  const b=document.createElement('bdi'); b.textContent=it.body; bd.append(b);
}
$('#paneclose').addEventListener('click',()=>{
  PANE=null; $('#app').classList.remove('pane-open'); $('#pane').hidden=true;
  $$('.linkid').forEach(x=>x.setAttribute('aria-current','false'));
});

/* ── 9 · THE INKING PASS ─────────────────────────────────────────────────────
   The page-load sequence is not a flourish: it is the selector running. Run
   ticks, then the delivered rows, then the gate ladder in select()'s order,
   then the ribbon in first-fit order. About 1.7 s, once, and never again until
   the inputs change or the reader asks for it.
   ── */
let inkTimer=null;
function ink(scr){
  if(!scr) return;
  scr.classList.remove('inking');
  void scr.offsetWidth;
  scr.classList.add('inking');
  $$('.sigil',scr).forEach((s,i)=>{ s.classList.remove('drawing'); void s.offsetWidth;
    armDraw(s,180+Math.min(i,10)*45); });
  if(scr.dataset.p==='watch') renderPulse(true);
  clearTimeout(inkTimer);
  inkTimer=setTimeout(()=>scr.classList.remove('inking'),2600);
}

/* ── 10 · SHELL WIRING ───────────────────────────────────────────────────── */
function show(name){
  $$('.screen').forEach(s=>s.hidden=s.dataset.p!==name);
  $$('.nav').forEach(b=>b.setAttribute('aria-current',b.dataset.s===name?'page':'false'));
  $('#rec').scrollTop=0;
  ink($('[data-p="'+name+'"]'));
}
$('.rail').addEventListener('click',e=>{
  const b=e.target.closest('.nav'); if(!b)return;
  if(b.dataset.s==='x'){ /* not built in this prototype */ return; }
  show(b.dataset.s);
});
$('#evsel').addEventListener('change',()=>{renderRibbons();ink($('[data-p="preview"]'));});
$('#replay').addEventListener('click',()=>ink($('.screen:not([hidden])')));
$('#stillbtn').addEventListener('click',()=>{
  const on=!document.body.classList.contains('still');
  document.body.classList.toggle('still',on);
  $('#stillbtn').setAttribute('aria-pressed',String(on));
});
$('#theme').addEventListener('click',()=>{
  const r=document.documentElement;
  r.dataset.theme = r.dataset.theme==='dark' ? 'light' : 'dark';
});
$('#lang').addEventListener('click',()=>{ HEB=!HEB; applyLang(); ink($('.screen:not([hidden])')); });

/* ── 11 · THE LIVE FEED ──────────────────────────────────────────────────────
   A record lands every 2.6 s and the pulse's partial column grows with it;
   every ten seconds the column commits and a new partial one opens. The
   cadence of arrival is accelerated for the panel and the strip says so —
   this product's whole claim is that it does not assert what it cannot show.
   ── */
function tick(){
  const [k,w,tok]=INCOMING[feedI++%INCOMING.length];
  const d=new Date();
  const at=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')
          +':'+String(d.getSeconds()).padStart(2,'0');
  ROWS.unshift(tok===undefined?[at,k,w]:[at,k,w,tok]);
  if(ROWS.length>13) ROWS.pop();
  const now=PULSE[PULSE.length-1]; now[k]=(now[k]||0)+1;
  if(!$('[data-p="watch"]').hidden){ renderAudit(kind); renderPulse(false); }
}
setInterval(tick,2600);
setInterval(()=>{ PULSE.push({}); if(PULSE.length>NCOL) PULSE.shift();
  if(!$('[data-p="watch"]').hidden) renderPulse(false); },10000);

/* ── boot ── */
applyLang();
renderPulse(true);
show('preview');
</script>
