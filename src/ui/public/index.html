<!doctype html>
<!-- The app shell — Task 16, with two additions once the screens that needed
     them existed: the .app grid wrapper (mockup ~1202-1226, ~2421-2426) that
     seats the header/rail/body/banner in the layout styles.css's own
     `.app{grid-template-areas:…}` rule now carries, and the icon sprite
     (mockup ~1169-1200) `screens/parts.js`'s openIcon() has always emitted a
     `<use href="#i-open">` against. Both copied byte-for-byte from the
     mockup, not invented — same rule as every block in styles.css. Still
     genuinely unbuilt: the mockup's item detail pane (aside.pane#pane),
     provenance bar (div.prov#prov) and footer strip (footer.strip), named
     "unowned" by this plan (§0.2) — `.app`'s own `prov`/`strip` grid rows
     simply collapse to their content (none) with no such element present. -->
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The mockup's own <title> (web-ui-mockup.html ~54) and what
       test/ui/server-e2e.test.ts already pins against the served page. -->
  <title>mycontext Console</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<!-- ICON SPRITE — docs/design/web-ui-mockup.html ~1169-1200 (Tabler outline
     icons, MIT licence: src/ui/public/icons/LICENSE-MIT.txt). Every symbol
     below is byte-identical to the mockup; the wrapping `<svg>` tag is the
     ONE deliberate exception, same shape and same reason as styles.css's own
     @font-face `url()` paths: the mockup writes `style="display:none"`, and
     the server's own CSP is `style-src 'self'` with no `unsafe-inline`
     (`ui/security.ts` ~321) — parts.js's own header names the identical
     constraint for JS-authored styles ("Where the mockup writes one, this
     code sets the same declaration through CSSOM instead"), but this is
     static markup with no script to run CSSOM from. `body>svg[aria-hidden=
     "true"]{display:none}` in styles.css carries the same effect instead —
     scoped to a DIRECT CHILD of body so it cannot also catch `.icon-open`,
     which is always nested inside a `.blk .linkid`, never a body child.
     Hidden and inert either way; a screen consumes a glyph with
     <svg class="icon-<name>"><use href="#i-<name>"/></svg> — `parts.js`'s
     openIcon() is the first and only consumer so far (#i-open). -->
<svg aria-hidden="true">
  <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4" />
    <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" />
  </symbol>
  <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 9.667a2.667 2.667 0 0 1 2.667 -2.667h8.666a2.667 2.667 0 0 1 2.667 2.667v8.666a2.667 2.667 0 0 1 -2.667 2.667h-8.666a2.667 2.667 0 0 1 -2.667 -2.667l0 -8.666" />
    <path d="M4.012 16.737a2.005 2.005 0 0 1 -1.012 -1.737v-10c0 -1.1 .9 -2 2 -2h10c.75 0 1.158 .385 1.5 1" />
  </symbol>
  <symbol id="i-open" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 6h-6a2 2 0 0 0 -2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-6" />
    <path d="M11 13l9 -9" />
    <path d="M15 4h5v5" />
  </symbol>
  <symbol id="i-confirm" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 12l5 5l10 -10" />
  </symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
    <path d="M21 21l-6 -6" />
  </symbol>
  <symbol id="i-add" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 5l0 14" />
    <path d="M5 12l14 0" />
  </symbol>
</svg>

<div class="app" id="app">
  <header id="topbar" class="hdr">
    <!-- .hdr is primitive 8: "git where the avatar would have gone" — branch,
         working tree, and the commit the corpus was reconciled against; no
         account, no bell, no plan badge. That content is not wired here: the
         provenance bar it was meant to sit beside is itself unowned (above),
         so this header carries only the pickers the mockup's third pass
         shows in it. -->
    <!-- The wordmark is not a translated string: the mockup renders it as a
         bare <b>mycontext</b> with no data-t, and a product name is not
         translated. -->
    <div class="logo"><span class="mark"></span><b>mycontext</b></div>
    <div class="topr">
      <!-- #focuspop IS built now — below, after `</header>`, beside #sesspop
           and for the same layout reason. What used to stand here said the
           dialog would be "inventing UI the mockup shows only as a target";
           the mockup does draw it (~2344) and the refusal became the defect
           the owner reported. `aria-expanded` is moved by app.js's
           togglePopover() and is no longer a permanent claim about a dialog
           there was no way to expand. -->
      <button class="sel" id="focusbtn" aria-haspopup="dialog" aria-expanded="false">
        <span id="focus-label"></span> <b id="focuslbl"></b>
      </button>
      <!-- #sesspop IS built now — below, after `</header>`, where the design of
           record puts it. `aria-haspopup="dialog"` finally names something that
           exists, and `aria-expanded` is moved by app.js's togglePopover()
           rather than being a permanent "false" about a dialog there was no way
           to expand. -->
      <button class="sel" id="sessbtn" aria-haspopup="dialog" aria-expanded="false">
        <span class="live"></span> <span id="session-label"></span> <b id="sesslbl"></b>
      </button>
      <button class="icon" id="lang" title="English / עברית">א/A</button>
      <!-- The accessible name for this button is an open question (§0.4,
           Task 1 Step 3) — a plain title attribute is the interim, not an
           answer to it. No #theme button: dark only (repaint Task 1). -->
    </div>
  </header>

  <!-- ══ THE SESSION PICKER — docs/design/web-ui-mockup.html ~2323-2342 ══
       (read as the design of record, never edited: owner ruling 2026-09-02,
       "it should stay as reference".)

       WHY IT SITS HERE and not inside `.topr`: `.pop{position:absolute}` with
       `inset-block-start:42px` measures from the initial containing block, and
       DOM order is tab order — a keyboard user reaches the trigger in the
       header, then the dialog it opened, then the rail. Nested inside `.topr`
       (a flex row) it would also be a flex item, and `[hidden]`'s `display:none`
       is the only thing that would keep it from widening the header.

       **THIS IS A READ, AND THAT IS WHY IT HAS NO CONFIRMATION.** Choosing a
       session changes which session every screen ASKS about — `ctx.session()`,
       and the listeners `ctx.onSessionChange` hands out — and writes nothing
       anywhere. `plan:walk seq:35` measured the cost of its absence: with no
       picker `ctx.session()` was always `/api/sessions`' `default`, so
       *Injected now* could only ever draw one session and its own e2e had to
       mount the screen module rather than navigate to it. Compare `#focuspop`
       below, which COMPOSES a command line and runs nothing.

       EVERY TEXT NODE IS EMPTY and filled by app.js's applyStatic() from
       `[data-t]` — the rule the whole shell follows (no innerHTML, no authored
       English the א/A toggle cannot reach). `#sesslist`'s rows are built by
       paintSessionList() from `/api/sessions`, so a session's NAME reaches the
       reader wherever `mycontext session name` gave it one.

       `aria-label` is authored in English beside `data-t-aria` for the same
       reason `#pane` and `#panegrip` carry both: nothing in this shell applies
       the -aria form yet, and a dialog with no accessible name at all is worse
       than one named in the wrong language. -->
  <div class="pop gloss float" id="sesspop" role="dialog" aria-label="Session"
       data-t-aria="aria.sesspop" hidden>
    <h3 data-t="sess.title"></h3>
    <div id="sesslist"></div>
    <p class="aside" data-t="sess.name"></p>
    <hr>
    <!-- The cold session is a DIFFERENT QUESTION, not another row of the list
         above, which is why the design of record puts a rule between them: it
         asks what a brand-new session would receive, and there is no ledger row
         for it to have come from. `data-cold` rather than a reserved
         `data-sid="cold"`, so the two can never be confused by a selector. -->
    <button class="row" data-cold="1">
      <span><b data-t="sess.cold"></b></span>
      <span class="small" data-t="sess.coldn"></span>
    </button>
    <p class="aside" data-t="sess.coldhelp"></p>
    <hr>
    <p class="aside" data-t="sess.parent"></p>
  </div>

  <!-- ══ THE FOCUS DIALOG — docs/design/web-ui-mockup.html ~2344-2356 ══
       (read as the design of record, never edited: owner ruling 2026-09-02.)

       It sits here, beside `#sesspop`, for the reason `#sesspop`'s own comment
       gives: `.pop{position:absolute}` measures from the initial containing
       block, DOM order is tab order, and nested inside `.topr` it would be a
       flex item widening the header.

       **THIS ONE COMPOSES, AND THAT IS THE WHOLE DIFFERENCE FROM `#sesspop`
       ABOVE.** The session picker moves a value this page already holds and
       tells nobody, so it is a READ and needs no confirmation. A focus changes
       what Claude receives on the NEXT event — it is written to
       `state/focus.json` by `mycontext focus`, and this UI does not write. So
       the two rows and the tag box below compose a command LINE, drawn in
       `.cmd` and handed to the one Copy-and-Execute control every composing
       screen already uses (`lib/command-actions.js`, adopted here by app.js's
       `paintFocusCommand()`). There is no second approval route in this file
       and no `POST` behind either row.

       The two rows are the design of record's, byte for byte: the focus that
       IS set (`state/focus.json`, an authored path and so not translated) and
       focus OFF. The tag box and the composed line are this app going beyond
       the mockup, which `17e7482` unpinned the parity gates to allow — the
       mockup's dialog toggles a demo variable, and a dialog that toggled a
       variable here would be claiming to have changed what Claude gets.

       EVERY TEXT NODE IS EMPTY and filled by app.js's applyStatic() from
       `[data-t]`, the rule the whole shell follows. `aria-label` is authored in
       English beside `data-t-aria` for the reason `#sesspop` states: nothing
       applies the -aria form yet, and a dialog with no accessible name at all
       is worse than one named in the wrong language. -->
  <div class="pop gloss float" id="focuspop" role="dialog" aria-label="Focus"
       data-t-aria="aria.focuspop" hidden>
    <h3 data-t="focus.title"></h3>
    <!-- The FIRST `.row`, and `togglePopover()` focuses it on open — so it is
         authored here rather than built, exactly as `#sesspop`'s cold row is,
         and the dialog is never focus-empty even before any data arrives. -->
    <button class="row" data-focus="live" aria-selected="true">
      <span><b data-t="focus.live"></b></span>
      <span class="small m">state/focus.json</span>
    </button>
    <button class="row" data-focus="off">
      <span><b data-t="focus.off"></b></span>
      <span class="small" data-t="focus.offn"></span>
    </button>
    <p class="aside" data-t="focus.help"></p>
    <hr>
    <!-- `--tag` and not a positional list: `mycontext focus <tag>…` and
         `--tag a,b` are both real, and the flag is the form the CLI's own
         usage documents and `core/command-flags.ts` declares ("one tag, or
         several comma-separated"). One spelling, quoted by `quoteArg`. -->
    <!-- ══ THE TAG PICKER ══════════════════════════════════════════════════
         `REQ-the-focus-dialog-offers-the-tags-it-could-focus-on-with-the` —
         owner request 2026-09-02: "i would like to have such a generated check
         box list with the item counts in the dialog so user could select there
         and not have to remember them".

         EMPTY HERE, and filled by app.js's paintFocusPicker() from
         `/api/tags`. Nothing is authored inside it because every row is a tag
         this workspace really carries — a hand-written example would be the
         hand-copied vocabulary `core/command-flags.ts` exists to remove, and
         the checked state is derived from the box below on every paint.

         The `.aside` IS authored, as the state before the first read answers:
         `focus.picking`. A dialog that opened onto an empty box could not be
         told apart from one whose corpus has no tags, which is
         `LESSON-on-real-data-an-absent-feature-and-a-missing-feature-look`. -->
    <div id="focuspick"><p class="aside" data-t="focus.picking"></p></div>
    <!-- THE BOX IS THE MODEL, and the picker above is a view onto it. Ticking
         a checkbox writes into this input; typing here re-marks the checkboxes.
         One list, so `focusArgv()` is unchanged and the OR-within-the-axis
         semantics (`core/select.ts`: `focus.tags.some(…)`) cannot drift into a
         second reading — and a tag that does not exist yet can still be typed,
         which a picker alone would take away. -->
    <label class="small" for="focustags"><span data-t="focus.tags"></span></label>
    <input class="tagin" id="focustags" type="text" autocomplete="off" spellcheck="false">
    <div class="cmd"><code id="focusargv"></code></div>
    <!-- Filled by `paintFocusCommand()` with `commandActions(...)` — never
         authored here, and never with innerHTML. -->
    <div id="focusact"></div>
    <p class="aside" data-t="focus.compose"></p>
  </div>

  <nav class="rail" id="nav" aria-label="Screens"></nav>
  <main class="body" id="screen"></main>
  <!-- The exit banner IS in the mockup: <div class="banner" id="exited"> with
       ex.msg and ex.ok. Its children are populated at runtime by app.js's
       banner() helper, never authored here — see the "no innerHTML anywhere"
       rule i18n.js and app.js both follow. -->
  <div class="banner" id="exited" hidden role="alert"></div>
  <!-- ITEM DETAIL PANE — docs/design/web-ui-mockup.html ~2328-2355.
       Where every `button.linkid` on every screen leads. `parts.js`'s linkId()
       has been writing those buttons since Task 16 and has said all along that
       "the shell owns the pane and delegates from the document"; until now
       there was no pane and no listener, so every id in the product was a
       button that did nothing when clicked. Reported by the owner twice.

       The `<dl>` labels carry `data-t` and are translated in place by
       i18n.js's applyStatic, exactly as the rest of this shell's static text
       is. The VALUES are filled at runtime by app.js — never authored here,
       and never with innerHTML, which is the rule this whole file follows.

       `#panespark` and its `pane.hist` / `pane.histn` captions were ABSENT
       here until 2026-08-25, and the reason was good: they want twelve weekly
       delivered/spilled buckets, `read-model.ts` says in its own words that
       `Usage` is a count and "a count cannot carry the spilled state at all"
       (~1433), and drawing an empty sparkline would claim a history was
       measured. Filed rather than faked, which was right.

       What ended it was building the missing source rather than relaxing the
       standard: `GET /api/item/:id/history` (watch-model.ts) reads the audit
       projection through the same read-only door every other projection read
       uses and answers TWO series — `weeks`, deliveries per bucket, and
       `spillw`, the buckets that held a spill. Two, because the mockup's own
       comment requires it: "a quiet week and a rejected week must never look
       alike".

       The refusal it replaces is still enforced, one level in: an ABSENT
       projection answers `weeks: null` and the pane SAYS the history is not
       measured instead of drawing twelve grey bars. -->

  <!-- THE DRAG HANDLE — the pane's inline-start edge, and the reason it comes
       BEFORE the pane rather than inside it: it sits on the boundary between
       the body and the pane, and DOM order is tab order, so a keyboard user
       reaches the edge on the way into the panel it controls rather than after
       having read past it.

       `role="separator"` with `tabindex="0"` is the ARIA pattern for a window
       splitter — a focusable separator with a value. The static half is
       authored here rather than written by `lib/pane-resize.js`: what this
       element IS is a fact about the document. `aria-valuenow` is the half the
       module owns, because it is the half that changes.

       It is `display:none` until `.app.pane-open` (styles.css), which keeps it
       out of the layout AND out of the tab order while there is no pane — and
       `grid-area:pane` against the two-column template would otherwise name no
       area at all and let the handle be auto-placed into some other cell. -->
  <div class="panegrip" id="panegrip" role="separator" aria-orientation="vertical"
       aria-controls="pane" tabindex="0" aria-label="Resize the item pane"
       data-t-aria="aria.panegrip"></div>

  <aside class="pane" id="pane" hidden aria-label="Item detail" data-t-aria="aria.pane">
    <div style="display:flex;justify-content:space-between;align-items:start;gap:8px">
      <h3 class="m" id="paneid">—</h3>
      <!-- THE FLOAT BUTTON — the owner's own words, 2026-08-27: "add a button
           on it's top right corner to make it floating popup in order to have a
           bigger window to look at it because it may include a long text
           boddy".

           BEFORE `#paneclose`, not after it: ✕ is the destructive control and
           it keeps the corner every reader already aims at. A new button
           appended past it would move the one control nobody wants to press by
           accident.

           `class="icon"` is load-bearing, not decoration. `styles.css`'s only
           global button rule is `button{font:inherit;color:inherit}` — it sets
           colour and NO background — so a classless button takes the app's
           light text and the user agent's near-white button face and is
           invisible. That is the defect the owner reported on 2026-08-27 in
           the Composer; `.icon` is what gives this one `background:var(--sink)`,
           and `e2e/pane-size.spec.ts` measures the contrast rather than
           trusting the class. -->
      <button class="icon" id="panefloat" aria-pressed="false"
              aria-label="Expand the item pane" data-t-aria="aria.panefloat">⤢</button>
      <button class="icon" id="paneclose" aria-label="Close" data-t-aria="aria.paneclose">✕</button>
    </div>
    <p class="small" id="panetitle"></p>

    <!-- THE SUMMARY, AND IT SITS HERE ON PURPOSE — docs/design/web-ui-mockup.html,
         the same three elements in the same order.

         `plan:walk seq:119` phase 3, filed and never built. Every active item in
         this corpus carries a `summary` — one plain sentence saying what the item
         IS, for a reader who does not know this codebase — and until now no screen
         in the product drew it. The owner's bar for it is "simple and very readable
         from first sight", and the whole point is that a reader understands the item
         WITHOUT reading its body.

         ABOVE the `<dl>`, not merely above the body. The brief asks for "the first
         thing read", and the `<dl>` is six rows of type/status/tier/scope/governs/
         file — machine facts that answer "does this apply to me" and are worth
         nothing to a reader who does not yet know what the item says. So the order
         is: what it is (id), what it is called (title), WHAT IT MEANS (summary),
         then the facts, then the body it spares you.

         All three start `hidden`, and that is the absent case rather than a loading
         state. `summary` is optional on `Item` — every corpus predates it, and the
         superseded and deprecated items were never given one — so an item with none
         must render as an item with none: no empty box, no blank line, no dash.
         app.js unhides exactly what it has something to put in.

         `#panestale` is the disclosure, and it is NOT decoration. `summary_of`
         records the content the summary was written against; when the item moves
         under it the two disagree and `summaryState` (core/content-hash.ts) reads
         `stale` — or `unanchored`, for a summary hand-edited into a file with no
         basis at all. Both mean the same thing to a reader: do not quote this as
         though it described the item. The sentence is shown, never hidden (nothing
         here is dropped silently) and never bare. -->
    <!-- AND IT IS LABELLED — owner ruling 2026-09-01, drawn in the design of
         record first and carried here.

         The owner asked whether there was a "Summary" title over this block; there
         was not, and the argument for leaving it bare was wrong in their own words:
         *"body has a section BODY - AS AUTHORED, properties has labels on the left
         for example type standard, status active"*. Every other block in this pane
         announces itself and the summary was the odd one out.

         `.welllabel` and NOT a new heading class: it is the register this pane
         already spends on exactly this job (`pane.hist` over the sparkline,
         `pane.body` over the well), so the pane gains a label rather than a new
         KIND of label. The key is translated by `fillStaticText`'s `[data-t]` sweep
         like the other nine in this file, so the א/A toggle reaches it.

         `hidden` to start and hidden WITH the sentence: `summary` is optional on
         `Item` and 16 items in this corpus carry none, so a label standing over an
         absent summary would be a heading for nothing — which is the empty-band
         defect this shell has already paid for twice. `fillPaneSummary` unhides the
         two together. -->
    <div class="welllabel" id="panesumlab" data-t="pane.summary" hidden>Summary</div>
    <p class="itemsum" id="panesummary" hidden></p>
    <p class="small summstale" id="panestale" hidden></p>
    <!-- The property chips — the owner's own ask, that the summary be shown "with
         the properties that complement the knowledge and understanding". Filled by
         app.js's paneProps(); which properties earn one, and why, is argued there. -->
    <div class="itemprops" id="paneprops" hidden></div>

    <dl>
      <dt data-t="pane.type">type</dt><dd class="m" id="panetype"></dd>
      <dt data-t="pane.status">status</dt><dd class="m" id="panestatus"></dd>
      <dt data-t="pane.tier">tier</dt><dd class="m" id="panetier"></dd>
      <dt data-t="pane.scope">scope</dt><dd class="m" id="panescope"></dd>
      <dt data-t="pane.gov">governs</dt><dd class="small" id="panegov"></dd>
      <dt data-t="pane.file">file</dt><dd class="m" id="panefile"></dd>
    </dl>
    <div class="welllabel" data-t="pane.hist">Delivered — twelve weeks</div>
    <div class="spark plate" id="panespark"></div>
    <p class="small" id="panespn"></p>
    <p class="small" data-t="pane.histn"></p>

    <div class="welllabel" data-t="pane.body">Body — as authored</div>
    <div class="well"><div class="md" id="panebody"></div></div>
    <p class="small" style="margin-block-start:8px" data-t="pane.well">Corpus text sits in a well and
      inside <span class="m">&lt;bdi&gt;</span>. The product's own words never do — that is how you tell
      them apart.</p>
  </aside>
</div>
  <script type="module" src="/app.js"></script>
</body>
</html>
